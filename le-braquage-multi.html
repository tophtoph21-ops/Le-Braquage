/* on ne redessine que si quelque chose a changé */
function cleDernierMessage(messages){
  var m=messages && messages.length ? messages[messages.length-1] : null;
  return m ? [messages.length,m.t||0,m.id||"",m.texte||""] : [0];
}
function recevoirEtat(etat){
  var avant=E;
  var anciensMessages=avant?(avant.messages||[]):[];
  var nouveauxMessages=etat.messages||[];
  var ancienneCle=JSON.stringify(cleDernierMessage(anciensMessages));
  var nouvelleCle=JSON.stringify(cleDernierMessage(nouveauxMessages));
  var signature=JSON.stringify([etat.phase,etat.tour,etat.manche,etat.alarmes,etat.securite,
    etat.restantes,etat.joueurs.map(function(j){return [j.nom,j.total,j.sac.length,j.cartesEnMain,j.penalite,j.fui,j.pris,j.connecte];}),
    etat.evenement,etat.historique]);
  var signatureChat=nouvelleCle;
  var jeuChange=(signature!==DERNIER);
  var chatChange=(signatureChat!==DERNIER_CHAT);
  var dernier=nouveauxMessages.length?nouveauxMessages[nouveauxMessages.length-1]:null;
  var nouveauMessage=chatChange && dernier && ancienneCle!==nouvelleCle;

  E=etat;
  if(!jeuChange && !chatChange) return;
  DERNIER_CHAT=signatureChat;

  // Un message seul ne doit pas reconstruire tout l'écran : sinon le clavier saute
  // et le texte en cours de saisie disparaît sur téléphone.
  if(!jeuChange){
    if(chatOuvert) actualiserChatSeulement();
    else actualiserPastilleChat();
    if(!chatOuvert && nouveauMessage && dernier.id!==MOI){
      msgNonLus++;
      actualiserPastilleChat();
      sonSpeciale(); vibre(12);
    }
    return;
  }

  DERNIER=signature;
  effetsDeLEvenement(avant,etat);
  dessiner();
  apresDessin();
  if(!chatOuvert && nouveauMessage && dernier.id!==MOI){
    msgNonLus++;
    actualiserPastilleChat();
    sonSpeciale(); vibre(12);
  }
}
function moiJoueur(){
  if(!E) return null;
  for(var i=0;i<E.joueurs.length;i++) if(E.joueurs[i].id===MOI) return E.joueurs[i];
  return null;
}
function cEstMonTour(){ return E && E.joueurs[E.tour] && E.joueurs[E.tour].id===MOI; }
function valSac(j){
  var brut=j.sac.reduce(function(s,c){return s+c.v;},0);
  return Math.max(0,brut-(j.penalite||0))
       + (j.planque||[]).reduce(function(s,c){return s+c.v;},0);
}
function valPlanque(j){ return (j.planque||[]).reduce(function(s,c){return s+c.v;},0); }
function valEnJeu(j){ return Math.max(0,j.sac.reduce(function(s,c){return s+c.v;},0)-(j.penalite||0)); }

/* ================= EFFETS DÉCLENCHÉS PAR LE SERVEUR ================= */
function effetsDeLEvenement(avant,etat){
  if((etat.securite||0) > ((avant&&avant.securite)||0)){
    var niv=etat.securite||1;
    toast(niv===1?"🚨 SÉCURITÉ RENFORCÉE — plus d'alarmes, moins d'avantages."
         :niv===2?"🚨 SÉCURITÉ MAXIMALE — le casse se durcit à deux."
                 :"🚨 DERNIER BRAQUEUR — chaque pioche devient dangereuse.","#ffd0c8");
    sonSirene(); vibre([60,50,60]);
  }
  var ev=etat.evenement;
  if(!ev){ if(etat.phase==="victoire" && (!avant || avant.phase!=="victoire")){ sonVictoire(); pluieDeBillets(42); } return; }
  var memeQuAvant = avant && avant.evenement &&
    JSON.stringify(avant.evenement)===JSON.stringify(ev);
  if(memeQuAvant) return;
  if(ev.type==="butin"){
    if(ev.carte.v===10){ sonLingot(); flash("or"); vibre([15,50,15]); }
    else { sonPiece(); vibre(16); }
  }else if(ev.type==="alarme"){
    flash("rouge"); secousse();
    if(ev.perte) toast("Alarme : -"+ev.perte+" point"+(ev.perte>1?"s":"")+" de butin !","#ffada3");
    if(ev.rang>=3){ sonSirene(); vibre([80,60,80,60,240]); }
    else { sonAlarme(2); vibre([40,60,40]); }
  }else if(ev.type==="police"){
    gyrophares(); sonSirene(); vibre([100,80,100,80,300]);
  }else if(ev.type==="fuite"){
    sonFuite(); flash("vert"); vibre([20,40,20]);
  }else if(ev.type==="vole"){
    sonPiece(); flash("or"); vibre([20,40,20]);
  }else if(ev.type==="sacperce"){
    flash("rouge"); sonSpeciale(); vibre(25);
  }else{
    sonSpeciale(); vibre(18);
  }
  if(etat.phase==="victoire" && (!avant || avant.phase!=="victoire")){ sonVictoire(); pluieDeBillets(42); }
}

/* dans combien de tours est-ce à moi ? */
function maPlace(){
  var moi=moiJoueur();

  if(E.joueurs[E.tour] && E.joueurs[E.tour].id===MOI) return "";   // c'est déjà à moi
  var n=E.joueurs.length, compte=0;
  for(var k=1;k<=n;k++){

    if(j.id===MOI) return compte===0 ? "un tour" : (compte+1)+" tours";
    if(!j.fui && !j.pris && j.connecte) compte++;

  return "";
}

/* Le coffre s'adapte à la place qui reste sous les joueurs : il tient toujours
   entièrement à l'écran, donc ses boulons dorés restent alignés sur son cercle. */
function ajusterCoffre(){
  var t=$("#matable"), p=$("#porte"), c=$("#coffre"), l=document.querySelector(".lampes");
  if(!t||!p||!c) return;
  var serre=(t.className==="serre");
  var grille=$("#sieges");
  var hautGrille = (serre && grille) ? grille.offsetHeight : 0;
  var dispo = t.clientHeight - hautGrille - (serre?10:0);
  var taille = Math.min(t.clientWidth*(serre?0.72:0.88), dispo, 340);
  if(taille<120) taille=120;
  var centre = hautGrille + dispo/2;
  [p,c].forEach(function(el2){
    el2.style.top=centre+"px";
    el2.style.bottom="auto";
    el2.style.transform="translate(-50%,-50%)";
  });
  p.style.width=taille+"px";  p.style.height=taille+"px";
  var creux=taille*0.485;
  c.style.width=creux+"px";   c.style.height=creux+"px";
  var deck=c.querySelectorAll(".carte");
  var largeurDeck=creux*0.62;
  Array.prototype.forEach.call(deck,function(k){
    k.style.width=largeurDeck+"px";
    k.style.height=(largeurDeck*1.39)+"px";
    var mono=k.querySelector(".mono");
    if(mono){ var m=largeurDeck*0.52;
      mono.style.width=m+"px"; mono.style.height=m+"px"; mono.style.fontSize=(m*0.36)+"px"; }
  });
  if(l){
    l.style.top=(centre + taille*0.325)+"px";   // sous la pioche, au cœur du coffre
    l.style.bottom="auto";
    l.style.transform="translate(-50%,-50%)";
  }
}
function habillerPorte(){
  ajusterCoffre();
  var p=$("#porte"); if(!p) return;
  var d=p.clientWidth, r=d/2, i, a;
  for(i=0;i<10;i++){
    a=(i/10)*Math.PI*2-Math.PI/2;
    var b=el("div","boulon");
    b.style.left=(r+Math.cos(a)*r*0.885)+"px";
    b.style.top=(r+Math.sin(a)*r*0.885)+"px";
    p.appendChild(b);
  }
  for(i=0;i<3;i++){
    var ray=el("div","rayon");
    ray.style.transform="translate(-50%,0) rotate("+(i*120+30)+"deg)";
    ray.style.height=(r*0.66)+"px";
    p.appendChild(ray);
  }
  [0.30,0.70].forEach(function(f){
    var c=el("div","charniere");
    c.style.left="-9px"; c.style.top=(d*f-18)+"px";
    p.appendChild(c);
  });
}

     :(compact?'':'<div class="tot">total '+j.total+'</div>'))+
    '<div class="mains">'+dos+'</div>'+

     :(estSuivant?'<div class="badge-tour suivant">APRÈS TOI</div>':''))+
    (rang&&!j.fui&&!j.pris?'<div class="rang-tour">'+rang+'</div>':'')+
    '</div>';

function placerSieges(){
  var z=$("#sieges"), t=$("#matable");
  if(!z||!t) return;
  // rangés dans l'ordre où ils vont jouer après moi, et non dans l'ordre du serveur
  var n0=E.joueurs.length, moiIdx=0;
  E.joueurs.forEach(function(j,i){ if(j.id===MOI) moiIdx=i; });
  var autres=[];
  for(var k=1;k<n0;k++) autres.push(E.joueurs[(moiIdx+k)%n0]);
  if(!autres.length) return;
  var n=autres.length;
  // qui joue juste après moi (en sautant ceux qui sont sortis)
  var suivant=null;
  for(var q=0;q<autres.length;q++){
    if(!autres[q].fui && !autres[q].pris && autres[q].connecte){ suivant=autres[q].id; break; }
  }

  // à partir de 6 adversaires : grille compacte en haut, coffre resserré dessous
  if(n>5){
    t.className="serre";
    z.className="grille";
    autres.forEach(function(j,k){
      var estSonTour=(E.joueurs[E.tour].id===j.id);
      var cls="siege compact"+(estSonTour&&!j.fui&&!j.pris?" actif":"")+
        (j.fui?" fui":"")+(j.pris?" pris":"")+(j.id===suivant?" suivant":"");
      var s=el("div",cls,jetonHTML(j,true,estSonTour,k+1,j.id===suivant));
      s.id="siege-"+k;
      z.appendChild(s);
    });
    requestAnimationFrame(function(){ ajusterCoffre(); });
    return;
  }

  // jusqu'à 5 adversaires : disposés en arc autour du haut du coffre
  t.className="";
  z.className="";
  var w=t.clientWidth, h=t.clientHeight, cy=h/2+16;
  var rx=Math.min(w/2-44,w*0.44), ry=Math.min(cy-52,h*0.44);
  autres.forEach(function(j,k){
    var frac = n===1 ? 0.5 : k/(n-1);
    var ang = Math.PI + frac*Math.PI;
    var x=w/2+Math.cos(ang)*rx, y=cy+Math.sin(ang)*ry*(n===1?1:0.96);
    var estSonTour=(E.joueurs[E.tour].id===j.id);
    var cls="siege"+(estSonTour&&!j.fui&&!j.pris?" actif":"")+(j.fui?" fui":"")+(j.pris?" pris":"")+
      (j.id===suivant?" suivant":"");
    var s=el("div",cls,jetonHTML(j,false,estSonTour,k+1,j.id===suivant));
    s.style.left=x+"px"; s.style.top=y+"px"; s.id="siege-"+k;
    z.appendChild(s);
  });
}

/* ---------- jouer une carte spéciale ---------- */
function apercuSac(x,marquerMax){
  if(!x.sac.length) return '<div class="apercu"><span class="vide">sac vide</span></div>';
  var tri=x.sac.map(function(c,i){return {c:c,i:i};}).sort(function(a,b){return b.c.v-a.c.v;});
  var montre=tri.slice(0,8), reste=tri.length-montre.length, h='<div class="apercu">';
  montre.forEach(function(o,k){
    var s=htmlCarte(o.c,"sm");
    if(marquerMax&&k===0) s=s.replace('class="carte sm"','class="carte sm perdue"');
    h+=s;
  });
  if(reste>0) h+='<span class="reste">+'+reste+'</span>';
  h+='</div>';
  if(marquerMax) h+='<div class="marque">perdra sa carte '+tri[0].c.v+'</div>';
  return h;
}
function choisirCible(moi,c,idx){
  // le Court-circuit n'a pas de cible : il éteint une alarme
  if(c.k==="courtcircuit"){
    if(!E.alarmes){ toast("Aucune alarme allumée pour l'instant.","var(--lagon)"); return; }
    envoyer({t:"speciale", index:idx});
    return;
  }
  // la Planque : on choisit une carte de SON PROPRE sac
  if(c.k==="planque"){
    if(!moi.sac.length){ toast("Ton sac est vide : rien à planquer.","var(--or)"); return; }
    choisirCartePlanque(moi,idx);
    return;
  }
  // le Monte-en-l'air n'a pas de cible : il te fait rejouer
  if(c.k==="monteenlair"){ envoyer({t:"speciale", index:idx}); return; }
  // Pickpocket : avant de choisir la victime, on révèle au joueur les cartes
  // spéciales de tous les adversaires qui en possèdent.
  if(c.k==="pickpocket"){
    var avecMain=E.joueurs.filter(function(x){return x.id!==MOI&&!x.fui&&!x.pris&&(x.cartesEnMain||0)>0;});
    if(!avecMain.length){ toast("Personne n'a de carte spéciale à voler.","var(--menthe)"); return; }
    envoyer({t:"speciale", index:idx});
    return;
  }
  var marquer=(c.k==="sacperce");
  var cibles;

/* ================= L'ESPION ================= */
function ecranEspion(){
  var ev=E.evenement, aMoi=(ev.pour===MOI), cartes=ev.cartes||[];
  if(!aMoi){
    var combien=ev.combien||cartes.length||3, dos="";
    for(var d=0;d<combien;d++) dos+=htmlDos("md");
    app.innerHTML='<div class="voile"><div class="entree" style="width:64px;height:64px;color:var(--jade)">'+
      EMBLEMES.espion+'</div><div class="libelle" style="color:var(--jade)">L\'ESPION</div>'+
      '<div class="detail">'+ev.nom+' inspecte les prochaines cartes du coffre… lui seul les voit.</div>'+
      '<div class="mainj" style="margin-top:18px">'+dos+'</div></div>';
    return;
  }
  var noms=ev.noms||[];
  var ordre=cartes.map(function(_,i){return i;});
  var choisie=-1, posees=[];

  function dessine(){
    var consigne = choisie<0
      ? "Tape une carte pour la sélectionner."
      : "Tape maintenant la carte avec laquelle l'échanger.";
    app.innerHTML='<div class="voile"><div class="entree" style="width:52px;height:52px;color:var(--jade)">'+
      EMBLEMES.espion+'</div><div class="libelle" style="color:var(--jade)">LES '+cartes.length+' PROCHAINES</div>'+
      '<div class="consigne'+(choisie<0?"":" actif")+'">'+consigne+'</div>'+
      '<div class="choix" id="tr"></div>'+
      '<div class="etiq" style="margin-top:14px;max-width:320px;line-height:1.5">'+
        'chaque carte ira au joueur indiqué, si chacun pioche à son tour</div>'+
      '<button class="b-or" id="ok" style="margin-top:16px;min-width:220px">Valider cet ordre</button>'+
      ((E.alarmes===2 && cartes.some(function(c){return c.t==="alarme";}))
        ?'<button class="b-vert" id="fantome" style="margin-top:10px;min-width:220px">Fuir discrètement</button>':'')+
      '</div>';
    var p=$("#tr");
    ordre.forEach(function(idx,pos){
      var qui=noms[pos] || (E.joueurs.filter(function(x){return !x.fui&&!x.pris&&x.connecte;}).length===1 ? {id:MOI,nom:"TOI"} : null);
      var moiIci=(qui && qui.id===MOI);
      var case_=el("div","case"+(pos===choisie?" choisie":"")+(posees.indexOf(pos)>=0?" pose":"")+(moiIci?" pourmoi":""));
      var d=el("div"); d.innerHTML=htmlCarte(cartes[idx], cartes.length>4?"md":"lg");
      case_.appendChild(d.firstElementChild);
      case_.appendChild(el("div","rang"+(moiIci?" moi":""), qui?(moiIci?"TOI":qui.nom):"—"));
      case_.onclick=function(){ toucher(pos); };
      p.appendChild(case_);
    });
    $("#ok").onclick=function(){ envoyer({t:"ordre", ordre:ordre}); };
    var fg=$("#fantome");
    if(fg) fg.onclick=function(){ envoyer({t:"fuiteFantome"}); };
  }
  function toucher(pos){
    if(choisie<0){ choisie=pos; sonSpeciale(); vibre(12); dessine(); return; }
    if(choisie===pos){ choisie=-1; vibre(8); dessine(); return; }
    var t=ordre[choisie];
    ordre[choisie]=ordre[pos];
    ordre[pos]=t;
    posees=[choisie,pos];
    choisie=-1;
    sonPiece(); vibre([10,40,10]);
    dessine();
  }
  dessine();
}

          "déjà ramassé. Au centre, <b>le coffre</b> : c'est la pioche.",
    attente:"ok", zone:"table" },

  { texte:"En bas, <b>ton sac</b>. Il est vide pour l'instant. Tout ce que tu piocheras s'y accumulera… "+
          "mais rien n'est acquis tant que tu restes dans le coffre.",
    attente:"ok", zone:"panneau" },

  { texte:"À toi de jouer. Appuie sur le bouton <b>PIOCHER</b>, en bas à gauche, "+
          "pour retourner ta première carte du coffre.",
    attente:"piocher",
    tirage:{t:"butin",v:5},
    apres:function(){ D.moi.sac.push({t:"butin",v:5}); },
    commentaire:"Un butin de <b>5 points</b> : des bijoux. Il rejoint ton sac. Plus le chiffre est gros, "+
                "plus la carte est rare — il n'y a que quelques lingots à 10 dans tout le coffre." },

  { texte:"Regarde en bas : <b>ton compteur de butin affiche 5</b>. C'est là que tu suivras ta récolte "+
          "pendant toute la manche. Mais attention, ce butin n'est <b>pas encore à toi</b> : "+
          "pour l'empocher, il faudra fuir avant la police. Repioche.",
    attente:"piocher", zone:"score",
    tirage:{t:"butin",v:3},
    apres:function(){ D.moi.sac.push({t:"butin",v:3}); },
    commentaire:"Encore <b>3 points</b>. Ton sac monte à 8. C'est tentant de continuer, non ?" },

  { texte:"C'est là que le jeu devient cruel. Repioche une fois.",
    attente:"piocher",
    tirage:{t:"alarme"},
    apres:function(){ D.alarmes=1; },
    commentaire:"<b>Une alarme !</b> Regarde le premier voyant s'allumer au-dessus de la pioche. "+
                "Neuf alarmes se cachent dans le coffre. À la <b>troisième</b>, la police débarque." },

  { texte:"Quand la police arrive, tous ceux qui sont <b>encore dans le coffre perdent tout</b> leur butin "+
          "de la manche. Ceux qui ont fui à temps gardent le leur. Voilà toute la tension du jeu.",
    attente:"ok", zone:"lampes" },

  { texte:"À chaque tour tu as donc <b>deux choix</b> : piocher pour grossir ton sac, ou fuir pour le mettre "+
          "à l'abri. Continue encore un peu, on va voir autre chose.",
    attente:"piocher",
    tirage:{t:"sp",k:"vol"},
    apres:function(){ D.moi.main.push({t:"sp",k:"vol"}); },
    commentaire:"Une <b>carte spéciale</b> ! Elle ne rapporte aucun point, mais elle donne un pouvoir. "+
                "Elle se range dans ta main, en bas de l'écran. <b>Les autres ne la voient pas</b> : "+
                "ils savent seulement que tu as une carte." },

  { texte:"Celle-ci, c'est <b>Le Vol</b> : elle te laisse piquer une carte dans le sac d'un adversaire. "+
          "Tape-la en bas de l'écran pour la jouer.",
    attente:"carte", zone:"main" },

  { texte:"Choisis ta victime. Tu vois le contenu de chaque sac : <b>Nina</b> a 9 points, c'est la plus juteuse.",
    attente:"cible", zone:"cibles" },

  { texte:"", attente:"auto",
    apres:function(){
      var pris=D.autres[1].sac.pop();       // on lui prend le 7
      D.moi.sac.push(pris);
    },
    commentaire:"Tu as volé le <b>7</b> de Nina : ton sac passe à 15, le sien retombe à 2. "+
                "Attention, cette carte n'est pas à l'abri pour autant — elle est dans ton sac, "+
                "donc tu la perdras aussi si la police t'attrape." },

  { texte:"Ton compteur est passé à <b>15</b> : le butin volé s'ajoute au tien. "+
          "Il existe <b>neuf cartes spéciales</b> en tout. Je te les montrerai toutes à la fin. "+
          "Pour l'instant, finissons la manche. Repioche.",
    attente:"piocher", zone:"score",
    tirage:{t:"alarme"},
    apres:function(){ D.alarmes=2; },
    commentaire:"<b>Deuxième alarme !</b> Le troisième voyant se met à clignoter. Une seule alarme de plus "+
                "et tout le monde tombe. Ton sac vaut 15 points…" },

  { texte:"Voilà le vrai dilemme du Braquage : <b>continuer et risquer 15 points</b>, ou <b>fuir</b> et les "+
          "empocher. Cette fois, on va être raisonnable : appuie sur <b>Fuir</b>.",
    attente:"fuir",
    apres:function(){ D.moi.fui=true; },
    commentaire:"Tu files avec le magot ! Ton sac est <b>sécurisé</b> : plus personne ne peut te le prendre, "+
                "et la police ne t'aura pas. En échange, tu ne joues plus jusqu'à la fin de la manche." },

  { texte:"Les autres, eux, continuent de piocher… et c'est là qu'on voit s'ils ont eu du nez.",
    attente:"ok",
    apres:function(){
      D.autres[0].sac.push({t:"butin",v:6});
      D.alarmes=3;
      D.autres[0].pris=true; D.autres[0].sac=[];
      D.autres[1].fui=true;
    } },

  { texte:"<b>La police a débarqué !</b> Vito était encore dans le coffre : il perd tout. "+
          "Nina avait fui juste avant, elle garde ses 2 points. Et toi, tes <b>15 points</b> sont acquis.",
    attente:"ok", zone:"table" },

  { texte:"Fin de la manche : ton sac sécurisé s'ajoute à ton <b>total</b>, juste à côté du butin. "+
          "On remélange tout et on recommence. Le premier à <b>100 points</b> gagne la partie "+
          "et devient le cerveau du siècle.",
    attente:"ok", zone:"score",
    apres:function(){ D.moi.total=15; D.autres[0].total=0; D.autres[1].total=2; } },

  { texte:"Dernière chose : <b>les neuf cartes spéciales</b>. Fais défiler pour les découvrir, "+
          "puis reviens jouer pour de vrai.",
    attente:"cartes" }
  ];
}

/* --- moteur du didacticiel --- */
function jouerEtape(){
  var etapes=etapesDidac(), e=etapes[DIDAC.etape];
  if(!e){ quitterDidacticiel(); return; }
  DIDAC.attente=e.attente;
  DIDAC.zone=e.zone||null;
  if(e.attente==="cartes"){ ecranGalerieCartes(); return; }
  if(e.attente==="auto"){ avancer(); return; }
  dessinerDidac(e);
}
function avancer(){
  var etapes=etapesDidac(), e=etapes[DIDAC.etape];
  DIDAC.sacAvant=DIDAC.moi.sac.reduce(function(s,c){return s+c.v;},0);
  if(e && e.apres) e.apres();
  if(e && e.commentaire){
    var carte=e.tirage;
    DIDAC.revele={carte:carte, texte:e.commentaire};
    DIDAC.etape++;
    dessinerDidac(null);
    return;
  }
  DIDAC.etape++;
  jouerEtape();
}
function fermerRevelation(){
  var avant=DIDAC.sacAvant;
  DIDAC.revele=null;
  var apres=DIDAC.moi.sac.reduce(function(s,c){return s+c.v;},0);
  DIDAC.sursaut=(apres!==avant);          // le compteur sursaute s'il a bougé
  jouerEtape();
  DIDAC.sursaut=false;
}

function dessinerDidac(e){
  var D=DIDAC;
  var lampes="";
  for(var i=0;i<3;i++) lampes+='<div class="lampe '+(i<D.alarmes?"on":"")+
    (i===2&&D.alarmes===2?" critique":"")+'"><i></i></div>';
  var pions=D.autres.map(function(j){
    var dos=""; for(var q=0;q<j.cartes;q++) dos+='<div class="dos-mini"></div>';
    return '<div class="siege'+(j.fui?" fui":"")+(j.pris?" pris":"")+'" style="position:static;transform:none">'+
      '<div class="jeton"><div class="nom">'+j.nom+'</div>'+
      '<div class="sac chiffre">'+(j.pris?"—":j.sac.reduce(function(s,c){return s+c.v;},0))+'</div>'+
      (j.fui?'<div class="statut" style="color:#8df0c2">À L\'ABRI</div>'
       :j.pris?'<div class="statut" style="color:#ffada3">PRIS</div>'
       :'<div class="tot">total '+j.total+'</div>')+
      '<div class="mains">'+dos+'</div></div></div>';
  }).join("");

  var butin=D.moi.sac.slice().sort(function(a,b){return b.v-a.v;})
    .map(function(c){return htmlCarte(c,"sm");}).join("");
  var main=D.moi.main.map(function(c,k){
    return htmlCarte(c,"lg").replace('class="carte lg"',
      'class="carte lg'+(D.attente==="carte"?" jouable guide":"")+'" data-dcarte="'+k+'"');
  }).join("");

  app.innerHTML=
    boutonSortir()+
    '<div class="ligne" style="padding:46px 0 5px"><span class="etiq">Apprentissage</span>'+
      '<span class="etiq">'+D.restantes+' cartes · but 100 pts</span></div>'+
    '<div id="matable" class="serre">'+
      '<div class="lampes'+(D.zone==="lampes"?" guide":"")+'">'+lampes+'</div>'+
      '<div class="porte" id="porte"></div>'+
      '<div class="creux" id="coffre">'+
        '<div class="pile-deck"><div class="ombre-pile">'+htmlDos("deck")+'</div>'+
        '<div class="'+(D.attente==="piocher"?"pulse":"")+'">'+htmlDos("deck")+'</div></div></div>'+
      '<div id="sieges" class="grille'+(D.zone==="table"?" guide":"")+'">'+pions+'</div>'+
    '</div>'+
    '<div class="moi-panneau'+(D.zone==="panneau"?" guide":"")+'">'+
      '<div class="moi-entete"><span class="moi-nom">'+(D.moi.fui?"TU ES À L\'ABRI":"TON SAC")+'</span>'+
        '<span class="moi-sac'+(D.zone==="score"?" guide":"")+'"><span class="lib">butin</span>'+
        '<span class="chiffre'+(D.sursaut?" sursaut":"")+'">'+
          D.moi.sac.reduce(function(s,c){return s+c.v;},0)+'</span>'+
        '<span class="lib">· total '+D.moi.total+'</span></span></div>'+
      '<div class="moi-butin">'+(butin||'<span style="font-size:11px;color:var(--brume);font-style:italic">sac vide</span>')+'</div>'+
      '<div class="moi-main'+(D.zone==="main"?" guide":"")+'">'+
        (main||'<div class="hint" style="margin:4px 0">aucune carte spéciale en main</div>')+'</div>'+
      '<div class="rangee" style="margin-top:9px">'+
        '<button class="b-or'+(D.attente==="piocher"?" guide":"")+'" id="d-piocher"'+
          (D.attente==="piocher"?"":" disabled")+'>Piocher</button>'+
        '<button class="b-vert'+(D.attente==="fuir"?" guide":"")+'" id="d-fuir"'+
          (D.attente==="fuir"?"":" disabled")+'>Fuir</button></div>'+
    '</div>'+
    coachHTML(e)+
    (D.revele?revelationDidac():"");

  habillerPorte();
  brancherSortir();
  brancherDidac(e);
}

function coachHTML(e){
  if(!e||!e.texte) return "";
  return '<div class="coach">'+
    '<div class="coach-tete"><span class="coach-ico">'+EMBLEMES.espion+'</span>'+
      '<span class="coach-titre">Le mentor</span></div>'+
    '<div class="coach-txt">'+e.texte+'</div>'+
    (e.attente==="ok"?'<button class="b-or" id="d-ok" style="margin-top:10px;width:100%">Compris</button>':
     '<div class="coach-action">'+
       (e.attente==="piocher"?"↓ Appuie sur « PIOCHER »":
        e.attente==="fuir"?"↓ Appuie sur « Fuir »":
        e.attente==="carte"?"↓ Tape ta carte spéciale":
        e.attente==="cible"?"↓ Choisis ta victime":"")+'</div>')+
  '</div>';
}
function revelationDidac(){
  var D=DIDAC;
  return '<div class="voile">'+
    (D.revele.carte?'<div class="entree">'+htmlCarte(D.revele.carte,"xl")+'</div>':"")+
    '<div class="coach" style="position:static;margin-top:18px;max-width:330px">'+
      '<div class="coach-txt">'+D.revele.texte+'</div>'+
      '<button class="b-or" id="d-suite" style="margin-top:12px;width:100%">Continuer</button>'+
    '</div></div>';
}
function brancherDidac(e){
  var D=DIDAC;
  if(D.revele){ $("#d-suite").onclick=fermerRevelation; return; }
  if(!e) return;
  if(e.attente==="ok"){ $("#d-ok").onclick=avancer; return; }
  if(e.attente==="piocher"){
    $("#d-piocher").onclick=function(){ sonPiece(); vibre(14); avancer(); };
    return;
  }
  if(e.attente==="fuir"){ $("#d-fuir").onclick=function(){ sonFuite(); flash("vert"); vibre([20,40,20]); avancer(); }; return; }
  if(e.attente==="carte"){
    Array.prototype.forEach.call(app.querySelectorAll("[data-dcarte]"),function(el2){
      el2.onclick=function(){ sonSpeciale(); D.moi.main=[]; avancer(); };
    });
    return;
  }
  if(e.attente==="cible"){ ecranCiblesDidac(); return; }
}
function ecranCiblesDidac(){
  var D=DIDAC;
  app.innerHTML='<div class="voile"><div class="entree" style="width:64px;height:64px;color:var(--fuchsia)">'+
    EMBLEMES.vol+'</div><div class="libelle" style="color:var(--fuchsia)">LE VOL</div>'+
    '<div class="etiq" style="margin:16px 0 10px">Chez qui piques-tu ?</div><div class="cible">'+
    D.autres.map(function(x,k){
      var v=x.sac.reduce(function(s,c){return s+c.v;},0);
      return '<button class="b-sombre riche'+(k===1?" guide":"")+'" data-dcible="'+k+'">'+
        '<div class="entete"><span>'+x.nom+'</span><span class="pts">'+v+' pts</span></div>'+
        '<div class="apercu">'+x.sac.map(function(c){return htmlCarte(c,"sm");}).join("")+'</div></button>';
    }).join("")+'</div>'+
    '<div class="coach" style="position:static;margin-top:16px;max-width:330px">'+
      '<div class="coach-txt">Nina a le plus gros butin : <b>tape sur elle</b>.</div></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll("[data-dcible]"),function(b){
    b.onclick=function(){
      if(parseInt(b.dataset.dcible,10)!==1){ toast("Prends plutôt chez Nina, elle est plus riche.","var(--or)"); return; }
      sonPiece(); flash("or"); vibre([20,40,20]); avancer();
    };
  });
}

/* --- galerie finale : les neuf cartes spéciales --- */
function ecranGalerieCartes(){
  var liste="";
  for(var k in SPECIALES){
    liste+='<div class="fiche">'+htmlCarte({t:"sp",k:k},"md")+
      '<div class="fiche-txt"><b style="color:'+SPECIALES[k].coul+'">'+SPECIALES[k].nom+'</b>'+
      '<p>'+SPECIALES[k].eff+'</p></div></div>';
  }
  app.innerHTML=
    boutonSortir()+
    '<h1 class="titre" style="font-size:21px;margin-top:44px">LES CARTES SPÉCIALES</h1><div class="filet"><i></i></div>'+
    '<div class="scroll" style="flex:1">'+
      '<div class="hint" style="margin-bottom:10px">Elles ne rapportent aucun point, mais changent le cours d\'une manche. '+
      'Les quatre dernières sont rares : deux exemplaires seulement.</div>'+
      liste+
      '<div class="panneau"><b style="color:var(--or)">Et voilà, tu sais jouer !</b>'+
      '<p style="font-size:13.5px;line-height:1.6;margin:6px 0 0">Résumé : tu <b>pioches</b> pour grossir ton sac, '+
      'tu <b>fuis</b> pour le mettre à l\'abri. À la <b>3ᵉ alarme</b>, ceux qui sont restés perdent tout. '+
      'Premier à <b>100 points</b> : gagné.</p></div>'+
    '</div>'+
    '<button class="b-or" id="d-fin">Jouer pour de vrai</button>';
  $("#d-fin").onclick=quitterDidacticiel;
  brancherSortir();
}
function quitterDidacticiel(){
  DIDAC=null;
  ecranAccueil();
}

/* ================= RÈGLES ================= */
function ecranRegles(){
  var sp="";
  for(var k in SPECIALES) sp+='<div class="ligne" style="align-items:flex-start">'+
    '<b style="color:'+SPECIALES[k].coul+';min-width:104px;font-size:12px;display:flex;align-items:center;gap:6px">'+
    '<span style="width:20px;height:20px;display:inline-block;flex:0 0 auto">'+EMBLEMES[k]+'</span>'+SPECIALES[k].nom+'</b>'+
    '<span style="font-size:12.5px;text-align:right;flex:1;line-height:1.45">'+SPECIALES[k].eff+'</span></div>';
  app.innerHTML=
    '<div class="scroll" style="flex:1">'+
      '<h1 class="titre" style="font-size:22px">RÈGLES DU JEU</h1><div class="filet"><i></i></div>'+
      '<div class="panneau"><b style="color:var(--or)">Chacun son téléphone</b>'+
      '<p style="font-size:14px;line-height:1.6;margin:6px 0 0">Un joueur monte le casse et annonce le code à 4 lettres. '+
      'Les autres le tapent sur leur téléphone. Tout le monde voit la même table.</p></div>'+
      '<div class="panneau"><b style="color:var(--or)">À ton tour</b>'+
      '<p style="font-size:14px;line-height:1.6;margin:6px 0 0">Appuie sur <b>PIOCHER</b> pour tenter une carte de plus, ou sur <b>FUIR</b> pour mettre ton sac à l\'abri. '+
      'Fuir met ton sac à l\'abri, mais tu ne joues plus jusqu\'à la fin de la manche.</p></div>'+
      '<div class="panneau"><b style="color:var(--sang)">Le danger</b>'+
      '<p style="font-size:14px;line-height:1.6;margin:6px 0 0">Les alarmes font perdre <b>1 à 5 points</b> de butin. À la <b>3ᵉ</b>, la police débarque : '+
      'tous ceux qui sont encore dans le coffre perdent tout. Quand il ne reste que 3 joueurs ou moins et qu\'un sac atteint 30 points, '+
      'la <b>Sécurité renforcée</b> ajoute du danger et réduit les avantages.</p></div>'+
      '<div class="panneau"><b style="color:var(--or)">Gagner</b>'+
      '<p style="font-size:14px;line-height:1.6;margin:6px 0 0">Premier à 100 points : le cerveau du siècle !</p></div>'+
      '<div class="panneau"><b style="color:var(--or-clair)">Les cartes spéciales</b>'+sp+'</div>'+
    '</div>'+
    '<button class="b-or" id="retour" style="margin-top:10px">Retour</button>';
  $("#retour").onclick=function(){ E?dessiner():ecranAccueil(); };
}


/* Android peut suspendre le WebSocket dès qu'on passe sur Snap, Messages, etc.
   Au retour dans l'application, on reprend automatiquement la même place. */
if(document.addEventListener){
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible") assurerConnexion();
  });
}
window.addEventListener("focus",assurerConnexion);
window.addEventListener("pageshow",assurerConnexion);
window.addEventListener("online",assurerConnexion);

window.addEventListener("resize",function(){
  if(E&&(E.phase==="tour")&&$("#sieges")){
    $("#sieges").innerHTML="";
    placerSieges();
    ajusterCoffre();
  }
});
/* installation de l'application : mise en cache pour l'usage hors connexion */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}

lancerIntro();

</script>
