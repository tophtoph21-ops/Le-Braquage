<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icone-192.png" type="image/png">
<meta name="apple-mobile-web-app-title" content="Braquage">
<title>Le Braquage</title>
<style>
:root{
  /* nuit d'encre */
  --encre:#070b14; --encre2:#0d1424; --marbre:#131c30; --marbre2:#1b2740;
  /* laiton & or */
  --or:#e3c05c; --or-clair:#fff3c4; --or-f:#8a6d18; --or-tres-f:#4a3a0c;
  /* accents */
  --sang:#d43a2c; --sang-f:#6e1810;
  --jade:#31b98a; --lagon:#2aa5c9; --amethyste:#a273e0; --nuitbleu:#3d7fd6;
  --ambre:#e89234; --fuchsia:#e8397f; --acier:#93a9c9; --rose:#ff86c0;
  --papier:#f4ecd8; --brume:#8d9ab5;
  --ombre:0 14px 38px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--encre); color:var(--papier);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
.deco{font-family:"Cinzel",Georgia,"Times New Roman",serif;letter-spacing:.16em}
.chiffre{font-family:"Cinzel",Georgia,serif;font-weight:700;font-variant-numeric:lining-nums}

/* ---------- fond : marbre sombre + trame art déco ---------- */
#fond{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 50% 8%,rgba(227,192,92,.11),transparent 58%),
    radial-gradient(ellipse at 50% 100%,rgba(61,127,214,.07),transparent 55%),
    linear-gradient(180deg,var(--encre) 0%,var(--marbre) 55%,var(--encre) 100%)}
#fond::after{content:"";position:absolute;inset:0;opacity:.16;
  background-image:
    repeating-linear-gradient(60deg,rgba(227,192,92,.16) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(-60deg,rgba(227,192,92,.16) 0 1px,transparent 1px 26px)}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 11px calc(env(safe-area-inset-bottom) + 10px)}

/* ---------- typo & filets ---------- */
.titre{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.2em;text-align:center;
  color:var(--or-clair);line-height:1.06;
  text-shadow:0 1px 0 #000,0 0 28px rgba(227,192,92,.5)}
h1.titre{font-size:clamp(26px,8.6vw,40px);margin:2px 0}
.sous{text-align:center;font-size:11.5px;color:var(--brume);letter-spacing:.22em;text-transform:uppercase}
.etiq{font-size:10px;color:var(--brume);letter-spacing:.16em;text-transform:uppercase}
.hint{font-size:12.5px;color:var(--brume);text-align:center;line-height:1.55}
.centre{text-align:center}.spacer{flex:1;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
/* filet art déco : trait – losange – trait */
.filet{display:flex;align-items:center;gap:8px;margin:9px 0}
.filet::before,.filet::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--or-f),transparent)}
.filet i{width:7px;height:7px;transform:rotate(45deg);background:var(--or);
  box-shadow:0 0 8px rgba(227,192,92,.7)}

/* ---------- boutons : plaques de laiton ---------- */
button{font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;border:none;cursor:pointer;padding:15px 16px;
  transition:transform .09s,box-shadow .2s,filter .2s;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),
    calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px)}
button:active{transform:translateY(2px)}
button:focus-visible{outline:2px solid var(--or-clair);outline-offset:3px}
.b-or{background:linear-gradient(180deg,var(--or-clair) 0%,var(--or) 42%,#a8821c 100%);
  color:#1e1704;box-shadow:0 5px 0 #6b530f,0 14px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.b-or:active{box-shadow:0 2px 0 #6b530f,0 7px 16px rgba(0,0,0,.55)}
.b-vert{background:linear-gradient(180deg,#63e0ac 0%,var(--jade) 45%,#187e5c 100%);
  color:#04231a;box-shadow:0 5px 0 #0e5b42,0 14px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.b-vert:active{box-shadow:0 2px 0 #0e5b42,0 7px 16px rgba(0,0,0,.55)}
.b-sombre{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  color:var(--papier);box-shadow:inset 0 0 0 1px rgba(227,192,92,.4),0 8px 18px rgba(0,0,0,.45)}
.b-rouge{background:linear-gradient(180deg,#f0705f,var(--sang) 55%,#8d1f14);color:#2b0703;
  box-shadow:0 5px 0 #6b1109,0 14px 26px rgba(0,0,0,.5)}
button[disabled]{opacity:.3;pointer-events:none;box-shadow:none}
.rangee{display:flex;gap:10px}.rangee>*{flex:1}

/* ================= ACCUEIL : LA BANQUE ================= */
#banque{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:flex-end;
  justify-content:center;overflow:hidden}
#banque svg{width:100%;height:100%;display:block}
.faisceau{transform-origin:50% 100%;animation:balaye 9s ease-in-out infinite alternate;opacity:.85;will-change:transform}
.faisceau.b2{animation-duration:12s;animation-delay:-4s}
@keyframes balaye{0%{transform:rotate(-19deg)}100%{transform:rotate(19deg)}}
.vitrail{animation:vacille 4.5s ease-in-out infinite}
@keyframes vacille{0%,100%{opacity:.92}45%{opacity:.66}70%{opacity:1}}
.etoile{animation:scintille 3.4s ease-in-out infinite}
@keyframes scintille{0%,100%{opacity:.25}50%{opacity:.95}}

/* ================= LA TABLE : PORTE DU COFFRE ================= */
#table{position:relative;flex:1;min-height:0;margin:2px 0}
.porte{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(88vw,338px);height:min(88vw,338px);border-radius:50%;
  background:
    radial-gradient(circle at 34% 26%,rgba(255,255,255,.22),transparent 44%),
    conic-gradient(from 15deg,#2c3547,#5d6a80,#5d6a80,#28303f,#59657a,#232b38,#4e5a6e,#2c3547,#5d6a80,#2c3547);
  box-shadow:0 0 0 3px #0b0f18,0 0 0 6px var(--or-f),0 0 0 8px #070b12,
    inset 0 0 50px rgba(0,0,0,.72),0 26px 60px rgba(0,0,0,.8),0 0 70px rgba(227,192,92,.14)}
.porte::before{content:"";position:absolute;inset:6%;border-radius:50%;
  border:2px solid rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.11)}
.porte::after{content:"";position:absolute;inset:15%;border-radius:50%;
  border:1px solid rgba(227,192,92,.34);box-shadow:inset 0 0 26px rgba(0,0,0,.6)}
.boulon{position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--or-clair),var(--or) 45%,#6d540f 78%);
  box-shadow:0 0 8px rgba(227,192,92,.55),inset 0 -1px 2px rgba(0,0,0,.7);
  transform:translate(-50%,-50%)}
.rayon{position:absolute;left:50%;top:50%;width:4px;
  background:linear-gradient(180deg,rgba(227,192,92,.85),rgba(227,192,92,.12));
  transform-origin:50% 0;border-radius:3px;box-shadow:0 0 10px rgba(227,192,92,.35)}
.charniere{position:absolute;width:16px;height:36px;border-radius:4px;
  background:linear-gradient(180deg,#7a8699,#2b3442);border:1px solid #10151f;
  box-shadow:0 4px 10px rgba(0,0,0,.7)}
.creux{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
  width:min(43vw,164px);height:min(43vw,164px);border-radius:50%;
  background:radial-gradient(circle at 46% 36%,#111a2b,#03060c 74%);
  box-shadow:inset 0 8px 30px rgba(0,0,0,.98),0 0 0 2px #0b0f18,
    0 0 0 4px rgba(227,192,92,.5),0 0 34px rgba(227,192,92,.16);
  display:flex;align-items:center;justify-content:center}
/* halo de projecteur au-dessus de la table */
#table::before{content:"";position:absolute;left:50%;top:-6%;transform:translateX(-50%);
  width:78%;height:70%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(227,192,92,.13),transparent 62%)}

/* lampes d'alarme */
.lampes{position:absolute;left:50%;top:50%;display:flex;gap:12px;z-index:4;
  transform:translate(-50%,calc(-1 * min(29vw,112px)))}
.lampe{width:27px;height:27px;border-radius:50%;border:2px solid #2b3547;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;transition:all .3s;position:relative}
.lampe i{width:9px;height:9px;border-radius:50%;background:#2b3547;display:block}
.lampe.on{border-color:var(--sang);
  box-shadow:0 0 20px rgba(212,58,44,.9),inset 0 0 8px rgba(255,120,100,.5)}
.lampe.on i{background:radial-gradient(circle at 35% 32%,#ffb0a4,var(--sang));
  box-shadow:0 0 12px rgba(212,58,44,1)}
.lampe.critique{animation:clign .8s ease-in-out infinite;will-change:transform}
@keyframes clign{0%,100%{transform:translateZ(0) scale(1)}50%{transform:translateZ(0) scale(1.2)}}
.lampe.critique::after{content:"";position:absolute;inset:-8px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,58,44,.75),transparent 70%);
  animation:halo .8s ease-in-out infinite;will-change:opacity}
@keyframes halo{0%,100%{opacity:.35}50%{opacity:1}}

/* sièges : plaques de laiton gravées */
.siege{position:absolute;transform:translate(-50%,-50%);width:76px;text-align:center;transition:all .3s}
.jeton{position:relative;padding:6px 5px 7px;
  background:linear-gradient(180deg,#1a2438,#0c1322);
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.35),0 7px 16px rgba(0,0,0,.6);
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),
    calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.siege.actif .jeton{background:linear-gradient(180deg,#3a3216,#1a1608);
  box-shadow:inset 0 0 0 1px var(--or),0 0 24px rgba(227,192,92,.55),0 7px 16px rgba(0,0,0,.6)}
.siege.actif::after{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;background:var(--or);box-shadow:0 0 10px rgba(227,192,92,.9)}
.siege.fui .jeton{box-shadow:inset 0 0 0 1px rgba(49,185,138,.6),0 7px 16px rgba(0,0,0,.6);opacity:.9}
.siege.pris .jeton{box-shadow:inset 0 0 0 1px rgba(212,58,44,.5),0 7px 16px rgba(0,0,0,.6);opacity:.55}
.siege .nom{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--papier)}
.siege .sac{font-family:"Cinzel",Georgia,serif;font-size:20px;font-weight:700;color:var(--or-clair);line-height:1.2}
.siege .tot{font-size:8.5px;color:var(--brume);letter-spacing:.08em}
.siege .statut{font-size:8px;font-weight:800;letter-spacing:.12em}
.siege .cartes{display:flex;gap:2px;justify-content:center;margin-top:2px;height:7px}
.siege .pastille{width:6px;height:6px;transform:rotate(45deg)}

/* ================= CARTES ================= */
.carte{position:relative;flex:0 0 auto;padding:2px;
  background:linear-gradient(150deg,var(--or-clair) 0%,var(--or-f) 38%,var(--or) 62%,var(--or-tres-f) 100%);
  box-shadow:var(--ombre);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),
    calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.carte .dedans{position:relative;height:100%;width:100%;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 30%,#1a2740 0%,#0a1120 62%,#050810 100%);
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),
    calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
  display:flex;flex-direction:column;align-items:center}
/* trame guillochée */
.carte .dedans::before{content:"";position:absolute;inset:0;opacity:.2;
  background-image:repeating-linear-gradient(45deg,currentColor 0 1px,transparent 1px 9px)}
.carte .cadre{position:absolute;inset:4px;border:1px solid currentColor;opacity:.5}
.carte .nom-f{position:relative;font-family:"Cinzel",Georgia,serif;font-weight:700;
  letter-spacing:.16em;text-align:center;width:100%}
.carte .medaille{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.carte .soleil{position:absolute;border-radius:50%;opacity:.34;
  background:repeating-conic-gradient(currentColor 0deg 3.4deg,transparent 3.4deg 12deg)}
.carte .disque{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 42% 34%,#101a2c,#05080f 72%);
  box-shadow:0 0 0 2px currentColor,0 0 0 4px rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.7),
    inset 0 0 18px rgba(0,0,0,.85)}
.carte .num{font-family:"Cinzel",Georgia,serif;font-weight:700;line-height:1;color:var(--papier);
  text-shadow:0 2px 5px rgba(0,0,0,.85)}
.carte .embleme{position:relative;display:flex;align-items:center;justify-content:center;width:100%}
.carte .coin{position:absolute;font-family:"Cinzel",Georgia,serif;font-weight:700;opacity:.92}
.carte .coin.hg{left:6px;top:5px}
.carte .coin.bd{right:6px;bottom:5px;transform:rotate(180deg)}
.carte .bas{position:relative;width:100%;text-align:center;font-family:"Cinzel",Georgia,serif;
  letter-spacing:.12em;color:var(--brume)}
.carte .txt{position:relative;background:var(--papier);color:#0d1220;text-align:center;
  font-weight:600;margin:0 7px 8px;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),
    calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}

.xl{width:min(56vw,206px);height:min(79vw,292px)}
.xl .nom-f{font-size:11.5px;padding:11px 0 3px}
.xl .soleil{width:150px;height:150px}
.xl .disque{width:104px;height:104px}
.xl .num{font-size:54px}
.xl .embleme{height:40px;margin-bottom:2px}
.xl .coin{font-size:14px}
.xl .txt{font-size:10.5px;line-height:1.42;padding:8px 7px}
.xl .bas{font-size:8.5px;padding-bottom:9px}

.md{width:68px;height:95px}
.md .nom-f{font-size:6.2px;padding:6px 0 1px}
.md .soleil{width:56px;height:56px}
.md .disque{width:40px;height:40px}
.md .num{font-size:21px}
.md .embleme{height:15px;margin-bottom:5px}
.md .coin{font-size:7px}
.md .coin.hg{left:3px;top:2px}.md .coin.bd{right:3px;bottom:2px}
.md .cadre{inset:3px}

.sm{width:40px;height:56px}
.sm .nom-f{font-size:0;padding:3px 0 0}
.sm .soleil{width:34px;height:34px}
.sm .disque{width:25px;height:25px}
.sm .num{font-size:13px}
.sm .embleme{display:none}
.sm .coin{display:none}
.sm .cadre{inset:2px}

.deck{width:min(27vw,100px);height:min(38vw,140px)}
/* dos de carte : monogramme dans un cartouche */
.dos .dedans{background:
  radial-gradient(circle at 50% 42%,rgba(227,192,92,.3),transparent 62%),
  repeating-linear-gradient(45deg,#0a1120 0 7px,#111c30 7px 14px);
  align-items:center;justify-content:center;color:var(--or)}
.dos .mono{position:relative;border-radius:50%;border:2px solid var(--or);
  display:flex;align-items:center;justify-content:center;
  font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--or-clair);
  box-shadow:0 0 20px rgba(227,192,92,.35),inset 0 0 16px rgba(0,0,0,.7);
  background:radial-gradient(circle at 42% 36%,#132038,#060a12 72%)}
.deck .mono{width:52px;height:52px;font-size:19px;letter-spacing:.02em}
.xl .mono{width:104px;height:104px;font-size:38px}
.md .mono{width:40px;height:40px;font-size:15px}
.sm .mono{width:26px;height:26px;font-size:10px}

.pile-deck{position:relative;display:flex;align-items:center;justify-content:center}
.pile-deck .ombre-pile{position:absolute;filter:brightness(.5)}
.pile-deck .ombre-pile:nth-child(1){transform:translate(7px,7px) rotate(3.5deg)}
.pile-deck .ombre-pile:nth-child(2){transform:translate(3px,3px) rotate(-2deg)}
.pulse{animation:resp 2.8s ease-in-out infinite}
@keyframes resp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ================= RÉVÉLATION ================= */
.voile{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;text-align:center;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 42%,rgba(20,30,52,.97),rgba(3,5,10,.985) 70%)}
.entree{animation:entree .5s cubic-bezier(.2,1.35,.35,1)}
@keyframes entree{from{transform:scale(.5) rotateY(-85deg);opacity:0}
  to{transform:scale(1) rotateY(0);opacity:1}}
.libelle{font-family:"Cinzel",Georgia,serif;font-size:19px;font-weight:700;letter-spacing:.1em;
  margin-top:18px;text-transform:uppercase}
.detail{font-size:13px;color:#b7c2d8;max-width:300px;line-height:1.6;margin-top:9px}
.mainj{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.mainj .carte{cursor:pointer}
.mainj .carte.jouable{filter:drop-shadow(0 0 7px rgba(227,192,92,.85))}

/* ================= EFFETS ================= */
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0}
.flash.rouge{background:radial-gradient(circle,rgba(255,60,45,.6),rgba(110,10,0,.85));animation:fl .55s}
.flash.vert{background:radial-gradient(circle,rgba(49,185,138,.45),rgba(4,60,42,.6));animation:fl .55s}
.flash.or{background:radial-gradient(circle,rgba(255,235,170,.5),rgba(90,66,0,.42));animation:fl .5s}
@keyframes fl{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.secoue{animation:sec .5s}
@keyframes sec{0%,100%{transform:translate(0,0)}15%{transform:translate(-10px,3px)}
  30%{transform:translate(9px,-3px)}45%{transform:translate(-8px,2px)}
  60%{transform:translate(7px,-2px)}80%{transform:translate(-4px,1px)}}
.gyro{position:fixed;inset:0;z-index:45;pointer-events:none;animation:gy .4s steps(1) 8}
@keyframes gy{0%{background:linear-gradient(90deg,rgba(255,40,30,.55),transparent 55%)}
  50%{background:linear-gradient(270deg,rgba(50,120,255,.55),transparent 55%)}}
.piece{position:fixed;z-index:44;pointer-events:none;width:19px;height:19px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--or-clair),var(--or) 48%,#7d6212 82%);
  box-shadow:0 0 10px rgba(227,192,92,.8);animation:tombe linear forwards}
@keyframes tombe{0%{transform:translateY(-12vh) rotate(0);opacity:1}
  100%{transform:translateY(106vh) rotate(720deg);opacity:.85}}
.etincelle{position:fixed;z-index:44;pointer-events:none;width:6px;height:6px;
  background:var(--or-clair);transform:rotate(45deg);animation:etin .8s ease-out forwards}
@keyframes etin{0%{transform:translate(0,0) rotate(45deg) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(0);opacity:0}}
.vol-carte{position:fixed;z-index:47;pointer-events:none;
  transition:transform .78s cubic-bezier(.32,.72,.28,1),opacity .78s}
.gagne{animation:gagne .55s ease-out}
@keyframes gagne{0%{transform:scale(1)}38%{transform:scale(1.55);text-shadow:0 0 20px var(--or-clair)}
  100%{transform:scale(1)}}

/* ================= PANNEAUX & LISTES ================= */
.panneau{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  padding:13px;margin:8px 0;
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.28),0 8px 20px rgba(0,0,0,.4);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),
    calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.ligne{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14.5px}
.ligne+.ligne{border-top:1px solid rgba(227,192,92,.16)}
.pts{font-family:"Cinzel",Georgia,serif;color:var(--or-clair);font-weight:700}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:3px 9px;letter-spacing:.1em;
  background:rgba(255,255,255,.06);color:var(--or-clair);
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.35)}
.tag.fui{color:#8df0c2;box-shadow:inset 0 0 0 1px rgba(49,185,138,.55)}
.tag.pris{color:#ffada3;box-shadow:inset 0 0 0 1px rgba(212,58,44,.55)}
input[type=text]{width:100%;padding:13px;border:none;font-size:16px;font-family:inherit;
  background:rgba(255,255,255,.06);color:var(--papier);
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.32);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),
    calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
input[type=text]::placeholder{color:#5f6d87}
.compteur{display:flex;align-items:center;gap:16px;justify-content:center}
.compteur button{width:50px;height:50px;padding:0;font-size:24px}
.compteur .n{font-family:"Cinzel",Georgia,serif;font-size:33px;font-weight:700;color:var(--or-clair);
  min-width:46px;text-align:center}
.cible{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.cible button{text-align:left;display:flex;justify-content:space-between;align-items:center;
  text-transform:none;letter-spacing:.02em}
.cible button.riche{flex-direction:column;align-items:stretch;gap:7px;padding:11px 12px}
.cible .entete{display:flex;justify-content:space-between;align-items:center;width:100%}
.apercu{display:flex;gap:3px;flex-wrap:wrap}
.apercu .carte.perdue{filter:drop-shadow(0 0 6px var(--ambre))}
.apercu .vide{font-size:11px;color:var(--brume);font-style:italic;padding:4px 0}
.apercu .reste{font-size:11px;color:var(--brume);align-self:center;padding-left:3px}
.marque{font-size:9.5px;font-weight:800;color:var(--ambre);letter-spacing:.1em;text-transform:uppercase}
/* bouton de sortie : discret, en haut à gauche */
#sortir{position:absolute;top:calc(env(safe-area-inset-top) + 3px);left:4px;z-index:6;
  background:none;border:none;box-shadow:none;clip-path:none;
  padding:5px 7px;opacity:.72;display:flex;align-items:center;gap:4px;
  letter-spacing:0;text-transform:none;font-weight:600}
#sortir:active{opacity:.85;transform:none}
#sortir svg{width:14px;height:14px;display:block;color:var(--or);flex:0 0 auto}
#sortir span{font-size:10px;letter-spacing:.09em;color:#fff;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,0,0,.9)}
#son{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:8px;z-index:6;
  background:none;box-shadow:none;padding:6px;opacity:.5;clip-path:none}
#son svg{width:19px;height:19px;display:block}

/* ============ ENTRER DANS LA BANQUE ============ */
/* pendant la transition on coupe toutes les animations d'ambiance :
   ce sont elles qui saccadaient (projecteurs, étoiles, vitrail) */
#banque.fige .faisceau,#banque.fige .etoile,#banque.fige .vitrail{animation:none!important}
#banque.fige{will-change:transform}
.zoom-porte{
  animation:zoomPorte 1.15s cubic-bezier(.45,.05,.7,.35) forwards;
  transform-origin:50% 68%;
  will-change:transform;backface-visibility:hidden}
@keyframes zoomPorte{from{transform:translateZ(0) scale(1)}to{transform:translateZ(0) scale(3.4)}}
.sortie-accueil{animation:sortieAccueil .4s ease-in forwards;will-change:transform,opacity}
@keyframes sortieAccueil{to{opacity:0;transform:translate3d(0,22px,0)}}
/* la lumière : un simple dégradé mis à l'échelle, sans ombre portée (l'ombre floue était le pire coupable) */
.eclat{position:fixed;width:260px;height:260px;border-radius:50%;z-index:34;pointer-events:none;
  margin-left:-130px;margin-top:-130px;
  background:radial-gradient(circle,#fff9e2 0%,#fff3c4 26%,#e3c05c 52%,rgba(168,130,28,.85) 78%,rgba(168,130,28,0) 100%);
  transform:translate3d(0,0,0) scale(.12);opacity:0;
  will-change:transform,opacity;backface-visibility:hidden;
  animation:eclat 1.05s cubic-bezier(.5,.03,.75,.4) .32s forwards}
@keyframes eclat{0%{transform:translate3d(0,0,0) scale(.12);opacity:.7}
  55%{opacity:1}
  100%{transform:translate3d(0,0,0) scale(9);opacity:1}}
.eclat.part{animation:eclatPart .55s ease-out forwards}
@keyframes eclatPart{from{opacity:1}to{opacity:0}}
.arrive{animation:arrive .45s ease-out}
@keyframes arrive{from{opacity:0}to{opacity:1}}

/* ============ MA ZONE (en bas, plus grande) ============ */
#matable{position:relative;flex:1;min-height:0;margin:0 0 2px;padding-top:30px}
.moi-panneau{position:relative;margin-top:4px;padding:9px 10px 10px;
  background:linear-gradient(180deg,rgba(227,192,92,.10),rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.45),0 -6px 22px rgba(0,0,0,.5);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%,0 12px)}
.moi-entete{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.moi-nom{font-family:"Cinzel",Georgia,serif;font-size:13px;letter-spacing:.14em;color:var(--or-clair)}
.moi-sac{display:flex;align-items:center;gap:9px}
.moi-sac .chiffre{font-size:34px;color:var(--or-clair);line-height:1}
.moi-sac .lib{font-size:10px;color:var(--brume);letter-spacing:.12em;text-transform:uppercase}
.moi-butin{display:flex;gap:3px;flex-wrap:wrap;min-height:24px;margin-bottom:7px}
.moi-main{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:8px}
.moi-main .carte{cursor:pointer}
.lg{width:88px;height:123px}
.lg .nom-f{font-size:7.5px;padding:7px 0 1px}
.lg .soleil{width:72px;height:72px}
.lg .disque{width:52px;height:52px}
.lg .num{font-size:27px}
.lg .embleme{height:20px;margin-bottom:6px}
.lg .coin{font-size:8.5px}
.lg .coin.hg{left:4px;top:3px}.lg .coin.bd{right:4px;bottom:3px}
.lg .cadre{inset:3px}
.lg .mono{width:52px;height:52px;font-size:19px}
.carte.jouable{filter:drop-shadow(0 0 8px rgba(227,192,92,.9))}
.attente{opacity:.55}
/* les autres joueurs, autour du haut du coffre */
.dos-mini{width:13px;height:18px;border-radius:2px;flex:0 0 auto;
  background:repeating-linear-gradient(45deg,#0a1120 0 3px,#16233a 3px 6px);
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.55)}
.siege .mains{display:flex;gap:2px;justify-content:center;margin-top:3px;height:18px}
/* grille des adversaires quand ils sont nombreux */
.grille{position:absolute;top:0;left:0;right:0;z-index:3;
  display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:6px 5px}
.grille .siege{position:static;transform:none}
.grille .siege.actif::after{display:none}
/* en mode resserré, le coffre est dimensionné et centré par le script
   pour tenir entièrement sous la grille (voir ajusterCoffre) */
.siege.compact{width:56px}
.siege.compact .jeton{padding:4px 3px 5px}
.siege.compact .nom{font-size:8.5px;letter-spacing:.03em}
.siege.compact .sac{font-size:15px}
.siege.compact .statut{font-size:6.5px;letter-spacing:.06em}
.siege.compact .mains{height:13px;gap:1px}
.siege.compact .dos-mini{width:9px;height:13px}
.siege.compact .badge-tour{font-size:6.5px;padding:1px 5px;bottom:-6px}
.siege .plus{font-size:8px;color:var(--brume);align-self:center}
.badge-tour{position:absolute;left:50%;transform:translateX(-50%);bottom:-7px;
  font-size:8px;font-weight:800;letter-spacing:.1em;color:#241a00;background:var(--or);
  padding:1px 7px;white-space:nowrap}


/* ============ SÉLECTION DE CARTE (Espion) ============ */
.choix{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.choix .case{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.choix .case .carte{transition:transform .22s cubic-bezier(.3,1.3,.5,1),filter .22s}
/* la carte choisie se soulève et flotte */
.choix .case.choisie .carte{
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(227,192,92,1));
  animation:flotte 1s ease-in-out infinite alternate}
@keyframes flotte{from{transform:translateY(-14px) rotate(-1.5deg)}
  to{transform:translateY(-22px) rotate(1.5deg)}}
/* les deux cartes qui viennent d'être échangées rebondissent en se posant */
.choix .case.pose .carte{animation:pose .55s cubic-bezier(.26,1.6,.4,1)}
@keyframes pose{0%{transform:translateY(-30px) scale(1.1)}
  55%{transform:translateY(5px) scale(.96)}
  78%{transform:translateY(-6px) scale(1.02)}
  100%{transform:translateY(0) scale(1)}}
.rang{font-family:"Cinzel",Georgia,serif;font-size:10px;letter-spacing:.12em;color:var(--brume);
  padding:3px 10px;box-shadow:inset 0 0 0 1px rgba(227,192,92,.3);transition:all .2s}
.choix .case:first-child .rang{color:var(--or-clair);box-shadow:inset 0 0 0 1px rgba(227,192,92,.75)}
.choix .case.choisie .rang{color:#241a00;background:var(--or);box-shadow:none;font-weight:700}
.consigne{font-size:13px;color:var(--papier);min-height:19px;margin:10px 0 16px;
  transition:color .2s}
.consigne.actif{color:var(--or-clair);font-weight:700}
.planque-zone{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:7px;
  padding:5px 7px;background:rgba(227,192,92,.10);
  box-shadow:inset 0 0 0 1px rgba(227,192,92,.45)}
.planque-lib{font-family:"Cinzel",Georgia,serif;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--or-clair);margin-right:4px}

/* ============ DIDACTICIEL ============ */
.coach{position:relative;margin-top:8px;padding:12px 13px;
  background:linear-gradient(180deg,rgba(227,192,92,.16),rgba(227,192,92,.05));
  box-shadow:inset 0 0 0 1px var(--or),0 -6px 24px rgba(0,0,0,.5);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%,0 12px)}
.coach-tete{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.coach-ico{width:22px;height:22px;color:var(--jade);flex:0 0 auto}
.coach-titre{font-family:"Cinzel",Georgia,serif;font-size:11px;letter-spacing:.18em;color:var(--or-clair)}
.coach-txt{font-size:14px;line-height:1.55;color:var(--papier)}
.coach-txt b{color:var(--or-clair)}
.coach-action{margin-top:9px;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  color:var(--or);text-align:center;animation:respireCoach 1.4s ease-in-out infinite}
@keyframes respireCoach{0%,100%{opacity:.6}50%{opacity:1}}
/* l'élément à toucher est mis en évidence */
.guide{position:relative;animation:guide 1.3s ease-in-out infinite}
@keyframes guide{0%,100%{filter:drop-shadow(0 0 3px rgba(227,192,92,.5))}
  50%{filter:drop-shadow(0 0 14px rgba(227,192,92,1))}}
button.guide{box-shadow:0 5px 0 #6b530f,0 0 0 3px var(--or-clair),0 14px 26px rgba(0,0,0,.55)}
/* mise en évidence du compteur de butin pendant l'apprentissage */
.moi-sac.guide{position:relative;padding:3px 9px;border-radius:8px;
  box-shadow:0 0 0 2px var(--or-clair),0 0 18px rgba(227,192,92,.7);
  background:rgba(227,192,92,.12)}
.moi-sac.guide::after{content:"ton butin";position:absolute;left:50%;top:-16px;
  transform:translateX(-50%);font-size:9px;letter-spacing:.14em;color:var(--or-clair);
  text-transform:uppercase;white-space:nowrap}
.chiffre.sursaut{display:inline-block;animation:sursaut .6s cubic-bezier(.26,1.6,.4,1)}
@keyframes sursaut{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.fiche{display:flex;gap:11px;align-items:center;padding:9px 0}
.fiche+.fiche{border-top:1px solid rgba(227,192,92,.16)}
.fiche-txt{flex:1}
.fiche-txt p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:#b7c2d8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<body>
<div id="fond"></div>
<div id="app"></div>
<script>
"use strict";
var app=document.getElementById("app");
function $(s){return document.querySelector(s);}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}

/* ================= SON ================= */
var AC=null, sonOn=true;
function ctx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function bip(f,d,type,vol,vers){
  if(!sonOn) return; var c=ctx(); if(!c) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,c.currentTime);
  if(vers) o.frequency.linearRampToValueAtTime(vers,c.currentTime+d);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(vol||.14,c.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02);
}
function sonPiece(){ bip(1180,.09,"triangle",.15); setTimeout(function(){bip(1720,.15,"triangle",.12);},65); }
function sonLingot(){ [880,1170,1560,2090].forEach(function(f,i){setTimeout(function(){bip(f,.2,"triangle",.14);},i*70);}); }
function sonSpeciale(){ bip(500,.1,"square",.09); setTimeout(function(){bip(760,.17,"square",.08);},80); }
function sonAlarme(n){ for(var i=0;i<(n||2);i++)(function(k){setTimeout(function(){bip(900,.16,"square",.13,660);},k*230);})(i); }
function sonSirene(){ if(!sonOn)return; for(var i=0;i<7;i++)(function(k){setTimeout(function(){bip(k%2?560:880,.33,"sawtooth",.1);},k*320);})(i); }
function sonFuite(){ bip(780,.34,"sine",.13,240); }
function sonVictoire(){ [523,659,784,1047,1319].forEach(function(f,i){setTimeout(function(){bip(f,.35,"triangle",.14);},i*130);}); }
function sonPorte(){
  if(!sonOn) return;
  bip(120,.85,"sawtooth",.10,52);                                  // grondement des gonds
  setTimeout(function(){ bip(420,.28,"square",.09,180); },520);     // pêne qui se retire
  setTimeout(function(){ bip(70,.5,"sine",.12,40); },700);          // battant lourd
  [880,1170,1560].forEach(function(f,i){
    setTimeout(function(){ bip(f,.4,"triangle",.09); },980+i*110);  // éclat de lumière
  });
}
function sonCoffre(){ bip(180,.22,"sawtooth",.1,90); }
function vibre(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }

/* ================= EFFETS ================= */
function flash(c){var d=el("div","flash "+c);document.body.appendChild(d);setTimeout(function(){d.remove();},560);}
function secousse(){app.classList.add("secoue");setTimeout(function(){app.classList.remove("secoue");},520);}
function gyrophares(){var d=el("div","gyro");document.body.appendChild(d);setTimeout(function(){d.remove();},3300);}
function pluieDePieces(n){
  for(var i=0;i<(n||18);i++)(function(k){setTimeout(function(){
    var p=el("div","piece");
    p.style.left=(Math.random()*94+2)+"vw";
    p.style.animationDuration=(1.5+Math.random()*1.4)+"s";
    document.body.appendChild(p);
    setTimeout(function(){p.remove();},3300);
  },k*85);})(i);
}
function etincelles(x,y,n,coul){
  for(var i=0;i<(n||12);i++){
    var e=el("div","etincelle"), a=Math.random()*Math.PI*2, d=45+Math.random()*85;
    e.style.left=x+"px"; e.style.top=y+"px";
    e.style.setProperty("--dx",Math.cos(a)*d+"px");
    e.style.setProperty("--dy",Math.sin(a)*d+"px");
    if(coul) e.style.background=coul;
    document.body.appendChild(e);
    (function(z){setTimeout(function(){z.remove();},850);})(e);
  }
}

/* ================= PAQUET ================= */
var QTES={1:8,2:8,3:8,4:7,5:7,6:6,7:5,8:4,9:3,10:4};
var SPECIALES={
  balance:{nom:"BALANCE",coul:"var(--amethyste)",ico:"\u2757",
    eff:"Ta cible est obligée de piocher à son prochain tour. Interdit de fuir !"},
  complice:{nom:"COMPLICE",coul:"var(--nuitbleu)",ico:"\uD83E\uDD1D",
    eff:"Quand la police débarque, ton sac est sauvé et sécurisé malgré tout."},
  sacperce:{nom:"SAC PERCÉ",coul:"var(--ambre)",ico:"\uD83D\uDCB0",
    eff:"Ta cible défausse la plus grosse carte de son sac."},
  espion:{nom:"L'ESPION",coul:"var(--jade)",ico:"\uD83D\uDD75",
    eff:"Regarde les 3 prochaines cartes de la pioche et remets-les dans l'ordre de ton choix."},
  vol:{nom:"LE VOL",coul:"var(--fuchsia)",ico:"\uD83E\uDDE4",
    eff:"Effet immédiat : vole une carte dans le sac d'un adversaire encore en jeu."},
  planque:{nom:"LA PLANQUE",coul:"var(--or)",ico:"",
    eff:"Mets une carte de ton sac à l'abri pour de bon : même la police ne pourra plus te la prendre."},
  courtcircuit:{nom:"COURT-CIRCUIT",coul:"var(--lagon)",ico:"",
    eff:"Éteins une alarme déjà déclenchée : le compteur redescend d'un cran."},
  monteenlair:{nom:"MONTE-EN-L'AIR",coul:"var(--acier)",ico:"",
    eff:"Rejoue deux fois de suite : deux pioches d'affilée, à tes risques et périls."},
  troc:{nom:"LE TROC",coul:"var(--rose)",ico:"",
    eff:"Échange ton sac entier avec celui d'un adversaire encore dans le coffre."}
};
/* --- rendu des cartes : voir plus bas --- */
function melange(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function neufPaquet(){
  var d=[],v,i,k;
  for(v in QTES) for(i=0;i<QTES[v];i++) d.push({t:"butin",v:parseInt(v,10)});
  for(i=0;i<9;i++) d.push({t:"alarme"});
  for(k in SPECIALES) for(i=0;i<3;i++) d.push({t:"sp",k:k});
  return melange(d);
}
/* ================= EMBLÈMES (dessinés, pas d'émojis) ================= */
function svg(inner,vb){
  return '<svg viewBox="'+(vb||"0 0 100 100")+'" width="100%" height="100%" '+
    'preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="5" '+
    'stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}
var EMBLEMES={
  billets:svg('<rect x="14" y="34" width="72" height="36" rx="3" fill="currentColor" opacity=".18"/>'+
    '<rect x="20" y="28" width="72" height="36" rx="3" stroke-width="5"/>'+
    '<circle cx="56" cy="46" r="9"/><path d="M56 39v14"/>'),
  bijoux:svg('<circle cx="50" cy="60" r="24" stroke-width="6"/>'+
    '<path d="M38 30h24l-6 12H44z" fill="currentColor" opacity=".25"/>'+
    '<path d="M38 30h24l-6 12H44z"/><path d="M44 42l6-12 6 12"/>'),
  diamants:svg('<path d="M26 40h48L50 82z" fill="currentColor" opacity=".2"/>'+
    '<path d="M26 40h48L50 82z"/><path d="M34 24h32l8 16H26z"/>'+
    '<path d="M34 24l-8 16M66 24l8 16M42 40L50 82M58 40L50 82M42 40l8-16 8 16"/>'),
  lingot:svg('<path d="M22 62h56l-8 16H30z" fill="currentColor" opacity=".22"/>'+
    '<path d="M22 62h56l-8 16H30z"/><path d="M30 42h40l-6 14H36z"/>'+
    '<path d="M40 24h20l-4 12H44z"/>'),
  alarme:svg('<path d="M28 62c0-16 4-30 22-30s22 14 22 30" fill="currentColor" opacity=".22"/>'+
    '<path d="M28 62c0-16 4-30 22-30s22 14 22 30"/><path d="M20 62h60"/>'+
    '<path d="M44 72a6 6 0 0012 0"/><path d="M50 32v-8"/>'+
    '<path d="M14 40C10 46 10 54 14 60M86 40c4 6 4 14 0 20"/>'),
  balance:svg('<path d="M50 16l30 12v22c0 18-13 28-30 34-17-6-30-16-30-34V28z" fill="currentColor" opacity=".18"/>'+
    '<path d="M50 16l30 12v22c0 18-13 28-30 34-17-6-30-16-30-34V28z"/>'+
    '<path d="M50 34v22" stroke-width="7"/><circle cx="50" cy="68" r="3.5" fill="currentColor" stroke="none"/>'),
  complice:svg('<circle cx="34" cy="34" r="12"/><circle cx="66" cy="34" r="12"/>'+
    '<path d="M14 78c0-13 9-22 20-22s20 9 20 22" opacity=".9"/>'+
    '<path d="M46 78c0-13 9-22 20-22s20 9 20 22"/>'),
  sacperce:svg('<path d="M32 40h36c8 10 12 22 12 30 0 10-13 16-30 16S20 80 20 70c0-8 4-20 12-30z" fill="currentColor" opacity=".2"/>'+
    '<path d="M32 40h36c8 10 12 22 12 30 0 10-13 16-30 16S20 80 20 70c0-8 4-20 12-30z"/>'+
    '<path d="M40 40l4-14h12l4 14"/><circle cx="64" cy="74" r="6" fill="#050810" stroke="currentColor"/>'+
    '<circle cx="74" cy="90" r="4"/>'),

/* ===========================================================
   MOTEUR LOCAL — le même code de règles que le serveur, embarqué
   ici pour que la partie solo tourne sans serveur ni connexion.
   Généré par construire.py : ne pas modifier à la main.
   =========================================================== */
var MOTEUR=(function(){
  var crypto={ randomInt:function(n){ return Math.floor(Math.random()*n); } };
  var salons=new Map();                // une seule table : la partie en cours
  function envoyer(){}                 // pas de réseau ici

/* ---------- règles du jeu (identiques au jeu de cartes) ---------- */
const QTES = {1:8,2:8,3:8,4:7,5:7,6:6,7:5,8:4,9:3,10:4};
// combien d'exemplaires de chaque carte spéciale
const SPECIALES = {
  balance:3, sacperce:3, espion:3, vol:3,
  monteenlair:3,     // gourmandise : deux pioches d'affilée
  complice:2,        // rare : elle sauve tout un sac
  planque:2,         // rare aussi : elle met du butin définitivement à l'abri
  courtcircuit:2,    // rare : elle éteint une alarme
  troc:2             // rare : elle échange deux sacs entiers
};
const NB_ALARMES = 9;
/* objectifs proposés : partie courte, longue, ou soirée entière */
const OBJECTIFS = [100, 300, 500];
function objectifValide(v){ return OBJECTIFS.indexOf(v|0)>=0 ? (v|0) : 100; }
const NOMS_SP = {
  balance:"BALANCE", complice:"COMPLICE", sacperce:"SAC PERCÉ",
  espion:"L'ESPION", vol:"LE VOL", planque:"LA PLANQUE",
  courtcircuit:"LE COURT-CIRCUIT", monteenlair:"MONTE-EN-L'AIR", troc:"LE TROC"
};

function melange(a){
  for(let i=a.length-1;i>0;i--){ const j=crypto.randomInt(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* Le début de manche doit rester respirable : pas d'alarme dans les 6 premières
   cartes, et pas deux alarmes avant la 18e. On remélange tant que ce n'est pas le cas. */
/* Les alarmes ne sont plus jetées au hasard : on leur réserve des emplacements
   espacés. Fini les deux alarmes coup sur coup et les manches expédiées. */
const DEBUT_SUR = 7;    // aucune alarme dans les 7 premières cartes
const ECART_MIN = 6;    // au moins 6 cartes entre deux alarmes

/* Seules les trois premières alarmes décident de la manche : c'est elles
   qu'on place, chacune dans sa fenêtre, avec un écart garanti. */
function entre(min,max){
  if(max<min) max=min;
  return min + crypto.randomInt(max-min+1);
}
/* Plus on est nombreux, plus chacun attend son tour : on allonge donc la manche
   proportionnellement, sinon on ne joue que 4 cartes à dix joueurs. */
function souffle(nbJoueurs){
  return Math.max(1, Math.min(2.2, (nbJoueurs||4)/5));
}
function positionsAlarmes(taille, combien, f){
  f = f || 1;
  const prises=new Set();
  const poser=(p)=>{                       // on pose sans jamais écraser une place déjà prise
    let x=Math.max(0,Math.min(taille-1,p));
    while(prises.has(x) && x<taille-1) x++;
    while(prises.has(x) && x>0) x--;
    prises.add(x);
    return x;
  };
  const ecart=Math.round(ECART_MIN*f);
  const a1=poser(entre(Math.round(DEBUT_SUR*f), Math.round(20*f)));
  const a2=poser(entre(a1+ecart, Math.round(34*f)));
  const a3=poser(entre(a2+ecart, Math.round(48*f)));
  // les six suivantes ne servent que si la manche s'éternise : on les étale
  let curseur=a3;
  for(let i=3;i<combien;i++){
    curseur+=ecart+crypto.randomInt(4);
    curseur=poser(Math.min(curseur,taille-1));
  }
  return [...prises].sort((x,y)=>x-y);
}

function neufPaquet(nbJoueurs){
  const f=souffle(nbJoueurs);
  const reste=[];
  // le butin grossit avec la table : de quoi alimenter les tours supplémentaires
  for(const v in QTES){
    const combien=Math.round(QTES[v]*f);
    for(let i=0;i<combien;i++) reste.push({t:"butin",v:+v});
  }
  // les cartes spéciales suivent aussi, mais les rares restent rares
  for(const k in SPECIALES){
    const rare=(SPECIALES[k]<=2);
    const combien=rare ? SPECIALES[k] : Math.round(SPECIALES[k]*f);
    for(let i=0;i<combien;i++) reste.push({t:"sp",k});
  }
  melange(reste);
  const taille = reste.length + NB_ALARMES;
  const places = positionsAlarmes(taille, NB_ALARMES, f);
  const marque = new Set(places);
  const paquet=[]; let n=0;
  for(let i=0;i<taille;i++) paquet.push(marque.has(i) ? {t:"alarme"} : reste[n++]);
  return paquet;
}
// le sac (en jeu, saisissable) + la planque (déjà à l'abri, même de la police)
const valeur = j => j.sac.reduce((s,c)=>s+c.v,0) + (j.planque||[]).reduce((s,c)=>s+c.v,0);
const valeurSac = j => j.sac.reduce((s,c)=>s+c.v,0);

/* ---------- salons ---------- */

function codeLibre(){
  const L="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c;
  do{ c=Array.from({length:4},()=>L[crypto.randomInt(L.length)]).join(""); }
  while(salons.has(c));
  return c;
}

function nouveauSalon(hoteId){
  return {
    code:codeLibre(), hote:hoteId, phase:"salon", cible:100,
    joueurs:[], pioche:[], alarmes:0, tour:0, manche:0,
    solo:false, jetonBot:0,
    premierFuyard:null, evenement:null, apercu:null, classement:null
  };
}
const actifs = s => s.joueurs.filter(j=>j.connecte && !j.fui && !j.pris);

/* Chaque joueur reçoit sa propre vue : sa main lui est réservée, celle des
   autres n'apparaît qu'en nombre de cartes. La pioche n'est jamais envoyée. */
function filtrerEvenement(ev, pourId){
  if(!ev) return null;
  // une carte spéciale piochée reste secrète : les autres voient un dos de carte
  if(ev.type==="speciale" && ev.pour!==pourId){
    return {type:"specialeCachee", nom:ev.nom, pour:ev.pour};
  }
  // les 3 cartes de l'Espion ne sont vues que par lui
  if(ev.type==="espionChoix" && ev.pour!==pourId){
    return {type:"espionAttente", nom:ev.nom, pour:ev.pour, combien:(ev.trois||[]).length};
  }
  return ev;
}
function etatPublic(s, pourId){
  return {
    code:s.code, solo:!!s.solo, phase:s.phase, cible:s.cible, manche:s.manche,
    alarmes:s.alarmes, restantes:s.pioche.length, hote:s.hote,
    tour:s.tour, evenement:filtrerEvenement(s.evenement,pourId),
    apercu:null, classement:s.classement,
    joueurs:s.joueurs.map(j=>({
      id:j.id, nom:j.nom, connecte:j.connecte, total:j.total,
      sac:j.sac,                                   // le butin reste posé sur la table
      planque:j.planque||[],                       // butin déjà à l'abri, hors d'atteinte
      main:(j.id===pourId ? j.main : null),        // la main : secrète
      cartesEnMain:j.main.length,
      fui:j.fui, pris:j.pris, force:j.force
    }))
  };
}
function diffuser(s){
  s.joueurs.forEach(j=>{
    if(j.ws && !j.ws.destroyed && j.ws.writable)
      envoyer(j.ws, JSON.stringify({t:"etat", etat:etatPublic(s,j.id)}));
  });
}
function joueurCourant(s){ return s.joueurs[s.tour]; }

function tourSuivant(s){
  if(!actifs(s).length || !s.pioche.length){ return finManche(s); }
  let n=s.tour, t=0;
  do{ n=(n+1)%s.joueurs.length; t++; }
  while((s.joueurs[n].fui||s.joueurs[n].pris||!s.joueurs[n].connecte) && t<=s.joueurs.length);
  s.tour=n; s.phase="tour"; s.evenement=null;
}

function nouvelleManche(s, premier){
  s.manche++; s.pioche=neufPaquet(s.joueurs.length); s.alarmes=0; s.premierFuyard=null;
  s.evenement=null; s.apercu=null; s.classement=null;
  s.joueurs.forEach(j=>{ j.sac=[]; j.main=[]; j.planque=[]; j.fui=false; j.pris=false; j.force=false; j.rab=0; });
  s.tour = premier % s.joueurs.length;
  if(!s.joueurs[s.tour].connecte) tourSuivant(s);
  s.phase="tour";
}

function finManche(s){
  s.joueurs.forEach(j=>{
    const g = j.pris ? (j.planque||[]).reduce((x,c)=>x+c.v,0) : valeur(j);
    j.gagneManche = g;
    j.total += g;
  });
  s.classement = s.joueurs.slice().sort((a,b)=>b.total-a.total)
    .map(j=>({id:j.id, nom:j.nom, total:j.total, gagne:j.gagneManche||0}));
  const max=s.classement[0].total;
  const exaequo=s.classement.filter(j=>j.total===max).length>1;
  s.phase = (max>=s.cible && !exaequo) ? "victoire" : "finManche";
  s.evenement=null;
}

function police(s){
  const sauves=[], pris=[];
  actifs(s).forEach(j=>{
    const i=j.main.findIndex(c=>c.k==="complice");
    if(i>=0){ j.main.splice(i,1); j.fui=true; sauves.push(j.nom); }
    else { j.pris=true; j.sac=[]; pris.push(j.nom); }   // la planque, elle, reste acquise
  });
  s.phase="police";
  s.evenement={type:"police", pris, sauves};
}

/* ---------- actions ---------- */
function piocher(s, joueur){
  if(s.phase!=="tour" || joueurCourant(s)!==joueur) return;
  const c=s.pioche.shift();
  if(!c){ return finManche(s); }
  joueur.force=false;
  if(c.t==="butin"){
    joueur.sac.push(c);
    s.phase="revele";
    s.evenement={type:"butin", carte:c, pour:joueur.id, nom:joueur.nom};
    return;
  }
  if(c.t==="alarme"){
    s.alarmes++;
    if(s.alarmes>=3){
      s.evenement={type:"alarme", carte:c, rang:3, pour:joueur.id, nom:joueur.nom};
      s.phase="revele";
      s.apercu="police";     // après le « continuer », la police débarque
      return;
    }
    s.phase="revele";
    s.evenement={type:"alarme", carte:c, rang:s.alarmes, pour:joueur.id, nom:joueur.nom};
    return;
  }
  if(c.k==="vol"){
    s.phase="revele";
    s.apercu="vol";
    s.evenement={type:"speciale", carte:c, pour:joueur.id, nom:joueur.nom};
    return;
  }
  joueur.main.push(c);
  s.phase="revele";
  s.evenement={type:"speciale", carte:c, pour:joueur.id, nom:joueur.nom};
}

function continuer(s, joueur){
  if(s.phase!=="revele" || joueurCourant(s)!==joueur) return;
  const suite=s.apercu; s.apercu=null;
  if(!suite && joueur.rab>0 && !joueur.fui && !joueur.pris){
    joueur.rab--;                              // Monte-en-l'air : il rejoue
    s.phase="tour"; s.evenement=null;
    return;
  }
  if(suite==="police"){ return police(s); }
  if(suite==="vol"){
    const cibles=actifs(s).filter(x=>x!==joueur && x.sac.length);
    if(!cibles.length){ return tourSuivant(s); }
    s.phase="vol"; s.evenement={type:"vol", pour:joueur.id, nom:joueur.nom};
    return;
  }
  tourSuivant(s);
}

function ordreEspion(s, joueur, m){
  if(s.phase!=="espion" || joueurCourant(s)!==joueur) return;
  const n=Math.min(3, s.pioche.length);
  const tete=s.pioche.slice(0,n);
  const ordre=(m.ordre||[]).map(i=>i|0).filter(i=>i>=0 && i<n);
  const uniques=[...new Set(ordre)];
  if(uniques.length===n){
    s.pioche = uniques.map(i=>tete[i]).concat(s.pioche.slice(n));
  }
  s.phase="revele"; s.apercu=null;
  s.evenement={type:"espion", nom:joueur.nom, pour:joueur.id};
}

function fuir(s, joueur){
  if(s.phase!=="tour" || joueurCourant(s)!==joueur || joueur.force) return;
  joueur.fui=true;
  if(s.premierFuyard===null) s.premierFuyard=s.joueurs.indexOf(joueur);
  s.phase="revele";
  s.evenement={type:"fuite", pour:joueur.id, nom:joueur.nom, points:valeur(joueur)};
  s.apercu=null;
}

function jouerSpeciale(s, joueur, m){
  if(!(s.phase==="tour"||s.phase==="vol") || joueurCourant(s)!==joueur) return;
  // le Vol demandé par le serveur (effet immédiat)
  if(s.phase==="vol"){
    const cible=s.joueurs.find(x=>x.id===m.cible);
    if(!cible || !cible.sac.length || cible===joueur) return;
    const i=Math.max(0, Math.min(m.carte|0, cible.sac.length-1));
    const volee=cible.sac.splice(i,1)[0];
    joueur.sac.push(volee);
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"vole", carte:volee, nom:joueur.nom, victime:cible.nom, pour:joueur.id};
    return;
  }
  const idx=m.index|0;
  const c=joueur.main[idx];
  if(!c) return;
  if(c.k==="espion"){
    joueur.main.splice(idx,1);
    s.phase="espion"; s.apercu=null;
    s.evenement={type:"espionChoix", trois:s.pioche.slice(0,3), nom:joueur.nom, pour:joueur.id};
    return;
  }
  if(c.k==="vol"){
    const cible=s.joueurs.find(x=>x.id===m.cible);
    if(!cible || !cible.sac.length || cible===joueur) return;
    joueur.main.splice(idx,1);
    const i=Math.max(0, Math.min(m.carte|0, cible.sac.length-1));
    const volee=cible.sac.splice(i,1)[0];
    joueur.sac.push(volee);
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"vole", carte:volee, nom:joueur.nom, victime:cible.nom, pour:joueur.id};
    return;
  }
  if(c.k==="monteenlair"){
    joueur.main.splice(idx,1);
    joueur.rab=2;                              // il rejouera deux fois de suite
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"monteenlair", nom:joueur.nom, pour:joueur.id};
    return;
  }
  if(c.k==="troc"){
    const autre=s.joueurs.find(x=>x.id===m.cible);
    if(!autre || autre===joueur || autre.fui || autre.pris) return;
    joueur.main.splice(idx,1);
    const mien=valeur(joueur), sien=valeur(autre);
    const t=joueur.sac; joueur.sac=autre.sac; autre.sac=t;   // la planque n'est pas échangée
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"troc", nom:joueur.nom, victime:autre.nom, pour:joueur.id,
                 avant:mien, apres:sien};
    return;
  }
  if(c.k==="courtcircuit"){
    if(s.alarmes<=0){ return; }              // rien à éteindre
    joueur.main.splice(idx,1);
    s.alarmes--;
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"courtcircuit", nom:joueur.nom, pour:joueur.id, restantes:s.alarmes};
    return;
  }
  if(c.k==="planque"){
    if(!joueur.sac.length) return;
    const i=Math.max(0, Math.min(m.carte|0, joueur.sac.length-1));
    joueur.main.splice(idx,1);
    const mise=joueur.sac.splice(i,1)[0];
    joueur.planque.push(mise);
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"planque", carte:mise, nom:joueur.nom, pour:joueur.id};
    return;
  }
  const cible=s.joueurs.find(x=>x.id===m.cible);
  if(!cible || cible===joueur || cible.fui || cible.pris) return;
  if(c.k==="balance"){
    joueur.main.splice(idx,1);
    cible.force=true;
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"balance", nom:joueur.nom, victime:cible.nom, pour:joueur.id};
    return;
  }
  if(c.k==="sacperce"){
    if(!cible.sac.length) return;
    joueur.main.splice(idx,1);
    let p=0; cible.sac.forEach((x,n)=>{ if(x.v>cible.sac[p].v) p=n; });
    const perdue=cible.sac.splice(p,1)[0];
    s.phase="revele"; s.apercu=null;
    s.evenement={type:"sacperce", carte:perdue, nom:joueur.nom, victime:cible.nom, pour:joueur.id};
    return;
  }
}

   COMPLICES DU TÉLÉPHONE (parties solo)

var NOMS_BOTS_MOTEUR=["Vito","Nina","Marlo","Suzie","Franck","Lola","Karim","Bébert","Gina"];

function estBot(j){ return !!j.bot; }

function botDecideFuite(s,j){
  const v=valeur(j);
  if(j.force || v===0) return false;
  const restantes=s.pioche.length||1;
  const pAlarme=s.pioche.filter(c=>c.t==="alarme").length/restantes;
  if(s.alarmes===2) return v>=11 || pAlarme>0.16 || Math.random()<0.30;
  if(s.alarmes===1) return v>=20 && Math.random()<0.55;
  return v>=30 && Math.random()<0.40;
}
function botJoueSpeciale(s,j){
  // un complice qui accumule finit par jouer : il ne garde jamais plus de deux cartes
  const trop = j.main.filter(c=>c.k!=="complice").length >= 2;
  // il inspecte la pioche dès la première alarme (les autres cas suivent)
  const es=j.main.findIndex(c=>c.k==="espion");
  if(es>=0 && (trop || (s.alarmes>=1 && Math.random()<0.6))){
    jouerSpeciale(s,j,{index:es});
    return true;
  }
  // éteindre une alarme quand ça chauffe vraiment
  const cc=j.main.findIndex(c=>c.k==="courtcircuit");
  if(cc>=0 && s.alarmes>=2){ jouerSpeciale(s,j,{index:cc}); return true; }
  // planquer sa plus grosse carte quand le sac devient précieux
  const pl=j.main.findIndex(c=>c.k==="planque");
  if(pl>=0 && j.sac.length && (s.alarmes>=1 || valeurSac(j)>=12)){
    let best=0; j.sac.forEach((c,n)=>{ if(c.v>j.sac[best].v) best=n; });
    jouerSpeciale(s,j,{index:pl, carte:best});
    return true;
  }
  // le Troc : quand le sac d'en face est nettement plus garni que le sien
  const tr=j.main.findIndex(c=>c.k==="troc");
  if(tr>=0){
    const proies=actifs(s).filter(x=>x!==j && valeurSac(x)>=valeurSac(j)+9);
    if(proies.length){
      let cible=proies[0];
      proies.forEach(x=>{ if(valeurSac(x)>valeurSac(cible)) cible=x; });
      jouerSpeciale(s,j,{index:tr, cible:cible.id});
      return true;
    }
  }
  // le Monte-en-l'air : tant qu'il n'y a pas d'alarme, on double la mise
  const ml=j.main.findIndex(c=>c.k==="monteenlair");
  if(ml>=0 && (trop || (s.alarmes===0 && Math.random()<0.6))){
    jouerSpeciale(s,j,{index:ml});
    return true;
  }
  // de temps en temps, un mauvais tour au joueur le mieux loti
  const i=j.main.findIndex(c=>c.k==="sacperce"||c.k==="balance");
  if(i<0 || (!trop && Math.random()>0.45)) return false;
  const c=j.main[i];
  const cibles=actifs(s).filter(x=>x!==j && (c.k!=="sacperce"||x.sac.length));
  if(!cibles.length) return false;
  let cible=cibles[0];
  cibles.forEach(x=>{ if(valeur(x)>valeur(cible)) cible=x; });
  jouerSpeciale(s,j,{index:i, cible:cible.id});
  return true;
}

/* Dernier filet : un complice qui a trop de cartes en joue une, quelle qu'elle soit.
   Sans cela il peut en accumuler quatre faute de conditions idéales. */
function botVideSaMain(s,j){
  if(j.main.filter(c=>c.k!=="complice").length < 3) return false;
  const autres=actifs(s).filter(x=>x!==j);
  for(let i=0;i<j.main.length;i++){
    const c=j.main[i];
    if(c.k==="complice") continue;
    if(c.k==="espion" || c.k==="monteenlair"){ jouerSpeciale(s,j,{index:i}); return true; }
    if(c.k==="courtcircuit" && s.alarmes>=1){ jouerSpeciale(s,j,{index:i}); return true; }
    if(c.k==="planque" && j.sac.length){ jouerSpeciale(s,j,{index:i, carte:0}); return true; }
    if(c.k==="vol" || c.k==="sacperce"){
      const proies=autres.filter(x=>x.sac.length);
      if(proies.length){ jouerSpeciale(s,j,{index:i, cible:proies[0].id, carte:0}); return true; }
    }
    if((c.k==="balance"||c.k==="troc") && autres.length){
      jouerSpeciale(s,j,{index:i, cible:autres[0].id}); return true;
    }
  }
  return false;
}
function botAgit(s){
  const j=joueurCourant(s);
  if(!j || !estBot(j)) return;
  if(s.phase==="tour"){
    if(botVideSaMain(s,j)) return;
    if(botJoueSpeciale(s,j)) return;         // la révélation enchaînera
    if(botDecideFuite(s,j)) fuir(s,j); else piocher(s,j);
    return;
  }
  if(s.phase==="revele"){ continuer(s,j); return; }
  if(s.phase==="vol"){
    const cibles=actifs(s).filter(x=>x!==j && x.sac.length);
    if(!cibles.length){ tourSuivant(s); return; }
    let cible=cibles[0];
    cibles.forEach(x=>{ if(valeur(x)>valeur(cible)) cible=x; });
    let meilleure=0;
    cible.sac.forEach((c,n)=>{ if(c.v>cible.sac[meilleure].v) meilleure=n; });
    jouerSpeciale(s,j,{cible:cible.id, carte:meilleure});
    return;
  }
  if(s.phase==="espion"){
    // il place la meilleure carte en premier, l'alarme en dernier
    const n=Math.min(3,s.pioche.length);
    const note=c=>c.t==="alarme"?-100:(c.t==="butin"?c.v:6);
    const ordre=Array.from({length:n},(_,i)=>i).sort((a,b)=>note(s.pioche[b])-note(s.pioche[a]));
    ordreEspion(s,j,{ordre});
    return;
  }
}
/* on programme le coup suivant si c'est à un complice de jouer */
function planifierBot(s){
  if(!s.solo) return;
  const j=joueurCourant(s);
  if(!j || !estBot(j)) return;
  if(["tour","revele","vol","espion"].indexOf(s.phase)<0) return;
  const jeton=++s.jetonBot;
  const delai = s.phase==="revele" ? 1300 : 900;   // le temps de lire l'écran
  setTimeout(()=>{
    if(!salons.has(s.code) || s.jetonBot!==jeton) return;
    botAgit(s);
    diffuser(s);
    planifierBot(s);
  },delai);
}

  return "Le casse du siècle : prévoyez la soirée.";

var reconnexion=null;

function connecter(surOuverture){
  var url=(location.protocol==="https:"?"wss://":"ws://")+location.host;
  try{ SOCK=new WebSocket(url); }
  catch(e){ ecranPanne("Impossible de joindre le serveur."); return; }
  SOCK.onopen=function(){ if(surOuverture) surOuverture(); };
  SOCK.onmessage=function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==="moi"){ MOI=m.id; CODE=m.code; return; }
    if(m.t==="erreur"){ toast(m.msg,"var(--sang)"); ecranAccueil(); return; }
    if(m.t==="etat"){ recevoirEtat(m.etat); }
  };
  SOCK.onclose=function(){
    if(SOLO) return;                                   // le solo ne dépend d'aucune connexion
    if(E && E.phase!=="salon"){ ecranPanne("Connexion perdue."); }
  };
  SOCK.onerror=function(){};
}

  if(SOLO){ MOTEUR.action(o); return; }              // aucune connexion nécessaire
  if(SOCK && SOCK.readyState===1) SOCK.send(JSON.stringify(o));
}

function brancherMain(moi){

    if(!c) return;

/* Le coffre s'adapte à la place qui reste sous les joueurs : il tient toujours
   entièrement à l'écran, donc ses boulons dorés restent alignés sur son cercle. */
function ajusterCoffre(){
  var t=$("#matable"), p=$("#porte"), c=$("#coffre"), l=document.querySelector(".lampes");
  if(!t||!p||!c) return;
  var serre=(t.className==="serre");
  var grille=$("#sieges");
  var hautGrille = (serre && grille) ? grille.offsetHeight : 0;
  var dispo = t.clientHeight - hautGrille - (serre?10:0);
  var taille = Math.min(t.clientWidth*(serre?0.72:0.88), dispo, 340);
  if(taille<120) taille=120;
  var centre = hautGrille + dispo/2;
  [p,c].forEach(function(el2){
    el2.style.top=centre+"px";
    el2.style.bottom="auto";
    el2.style.transform="translate(-50%,-50%)";
  });
  p.style.width=taille+"px";  p.style.height=taille+"px";
  var creux=taille*0.485;
  c.style.width=creux+"px";   c.style.height=creux+"px";
  var deck=c.querySelectorAll(".carte");
  var largeurDeck=creux*0.62;
  Array.prototype.forEach.call(deck,function(k){
    k.style.width=largeurDeck+"px";
    k.style.height=(largeurDeck*1.39)+"px";
    var mono=k.querySelector(".mono");
    if(mono){ var m=largeurDeck*0.52;
      mono.style.width=m+"px"; mono.style.height=m+"px"; mono.style.fontSize=(m*0.36)+"px"; }
  });
  if(l){
    l.style.top=(centre + taille*0.325)+"px";   // sous la pioche, au cœur du coffre
    l.style.bottom="auto";
    l.style.transform="translate(-50%,-50%)";
  }
}
function habillerPorte(){
  ajusterCoffre();
  var p=$("#porte"); if(!p) return;
  var d=p.clientWidth, r=d/2, i, a;
  for(i=0;i<10;i++){
    a=(i/10)*Math.PI*2-Math.PI/2;
    var b=el("div","boulon");
    b.style.left=(r+Math.cos(a)*r*0.885)+"px";
    b.style.top=(r+Math.sin(a)*r*0.885)+"px";
    p.appendChild(b);
  }
  for(i=0;i<3;i++){
    var ray=el("div","rayon");
    ray.style.transform="translate(-50%,0) rotate("+(i*120+30)+"deg)";
    ray.style.height=(r*0.66)+"px";
    p.appendChild(ray);
  }
  [0.30,0.70].forEach(function(f){
    var c=el("div","charniere");
    c.style.left="-9px"; c.style.top=(d*f-18)+"px";
    p.appendChild(c);
  });
}

/* ---------- les autres joueurs : autour du haut du coffre ---------- */
function jetonHTML(j,compact,estSonTour){
  var dos="", combien=j.cartesEnMain||0, montre=Math.min(combien, compact?3:5);
  for(var q=0;q<montre;q++) dos+='<div class="dos-mini"></div>';
  if(combien>montre) dos+='<span class="plus">+'+(combien-montre)+'</span>';
  return '<div class="jeton"><div class="nom">'+j.nom+'</div>'+
    '<div class="sac chiffre">'+(j.pris?"—":valSac(j))+'</div>'+
    (j.fui?'<div class="statut" style="color:#8df0c2">À L\'ABRI</div>'
     :j.pris?'<div class="statut" style="color:#ffada3">PRIS</div>'
     :!j.connecte?'<div class="statut" style="color:#ffada3">PARTI</div>'
     :(compact?'':'<div class="tot">total '+j.total+'</div>'))+
    '<div class="mains">'+dos+'</div>'+
    (estSonTour&&!j.fui&&!j.pris?'<div class="badge-tour">À LUI</div>':'')+
    '</div>';
}
function placerSieges(){
  var z=$("#sieges"), t=$("#matable");
  if(!z||!t) return;
  var autres=E.joueurs.filter(function(x){ return x.id!==MOI; });
  if(!autres.length) return;
  var n=autres.length;

  // à partir de 6 adversaires : grille compacte en haut, coffre resserré dessous
  if(n>5){
    t.className="serre";
    z.className="grille";
    autres.forEach(function(j,k){
      var estSonTour=(E.joueurs[E.tour].id===j.id);
      var cls="siege compact"+(estSonTour&&!j.fui&&!j.pris?" actif":"")+
        (j.fui?" fui":"")+(j.pris?" pris":"");
      var s=el("div",cls,jetonHTML(j,true,estSonTour));
      s.id="siege-"+k;
      z.appendChild(s);
    });
    return;
  }

  // jusqu'à 5 adversaires : disposés en arc autour du haut du coffre
  t.className="";
  z.className="";
  var w=t.clientWidth, h=t.clientHeight, cy=h/2+16;
  var rx=Math.min(w/2-44,w*0.44), ry=Math.min(cy-52,h*0.44);
  autres.forEach(function(j,k){
    var frac = n===1 ? 0.5 : k/(n-1);
    var ang = Math.PI + frac*Math.PI;
    var x=w/2+Math.cos(ang)*rx, y=cy+Math.sin(ang)*ry*(n===1?1:0.96);
    var estSonTour=(E.joueurs[E.tour].id===j.id);
    var cls="siege"+(estSonTour&&!j.fui&&!j.pris?" actif":"")+(j.fui?" fui":"")+(j.pris?" pris":"");
    var s=el("div",cls,jetonHTML(j,false,estSonTour));
    s.style.left=x+"px"; s.style.top=y+"px"; s.id="siege-"+k;
    z.appendChild(s);
  });
}

/* ---------- jouer une carte spéciale ---------- */
function apercuSac(x,marquerMax){
  if(!x.sac.length) return '<div class="apercu"><span class="vide">sac vide</span></div>';
  var tri=x.sac.map(function(c,i){return {c:c,i:i};}).sort(function(a,b){return b.c.v-a.c.v;});
  var montre=tri.slice(0,8), reste=tri.length-montre.length, h='<div class="apercu">';
  montre.forEach(function(o,k){
    var s=htmlCarte(o.c,"sm");
    if(marquerMax&&k===0) s=s.replace('class="carte sm"','class="carte sm perdue"');
    h+=s;
  });
  if(reste>0) h+='<span class="reste">+'+reste+'</span>';
  h+='</div>';
  if(marquerMax) h+='<div class="marque">perdra sa carte '+tri[0].c.v+'</div>';
  return h;
}
function choisirCible(moi,c,idx){
  // le Court-circuit n'a pas de cible : il éteint une alarme
  if(c.k==="courtcircuit"){
    if(!E.alarmes){ toast("Aucune alarme allumée pour l'instant.","var(--lagon)"); return; }
    envoyer({t:"speciale", index:idx});
    return;
  }
  // la Planque : on choisit une carte de SON PROPRE sac
  if(c.k==="planque"){
    if(!moi.sac.length){ toast("Ton sac est vide : rien à planquer.","var(--or)"); return; }
    choisirCartePlanque(moi,idx);
    return;
  }
  // le Monte-en-l'air n'a pas de cible : il te fait rejouer
  if(c.k==="monteenlair"){ envoyer({t:"speciale", index:idx}); return; }
  var marquer=(c.k==="sacperce");
  var cibles=E.joueurs.filter(function(x){
    return x.id!==MOI && !x.fui && !x.pris &&
      ((c.k!=="sacperce"&&c.k!=="vol")||x.sac.length);
  });
  if(c.k==="espion"){ envoyer({t:"speciale", index:idx}); return; }
  if(!cibles.length){ toast("Aucune cible possible."); return; }
  app.innerHTML='<div class="voile"><div class="entree">'+htmlCarte(c,"xl")+'</div>'+
    '<div class="etiq" style="margin:16px 0 10px">Sur qui ?</div><div class="cible">'+
    cibles.map(function(x,k){
      return '<button class="b-sombre riche" data-i="'+k+'">'+
        '<div class="entete"><span>'+x.nom+'</span><span class="pts">'+valSac(x)+' pts</span></div>'+
        apercuSac(x,marquer)+'</button>';
    }).join("")+
    '<button class="b-rouge" id="annul">Annuler</button></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll("[data-i]"),function(b){
    b.onclick=function(){
      var cible=cibles[parseInt(b.dataset.i,10)];
      if(c.k==="vol") return choisirCarteVolee(cible,idx);
      envoyer({t:"speciale", index:idx, cible:cible.id});
    };
  });
  $("#annul").onclick=dessiner;
}
function choisirCartePlanque(moi,idx){
  app.innerHTML='<div class="voile"><div class="entree" style="width:60px;height:60px;color:var(--or)">'+
    EMBLEMES.planque+'</div><div class="libelle" style="color:var(--or)">LA PLANQUE</div>'+
    '<div class="detail" style="margin:10px 0 16px">Quelle carte veux-tu mettre définitivement à l\'abri ?</div>'+
    '<div class="mainj" style="max-width:330px" id="sacm"></div>'+
    '<button class="b-rouge" id="annul" style="margin-top:18px;min-width:200px">Annuler</button></div>';
  var p=$("#sacm");
  moi.sac.forEach(function(c,k){
    var d=el("div"); d.innerHTML=htmlCarte(c,"md");
    var e=d.firstElementChild; e.className+=" jouable";
    e.onclick=function(){ envoyer({t:"speciale", index:idx, carte:k}); };
    p.appendChild(e);
  });
  $("#annul").onclick=dessiner;
}

function choisirCarteVolee(cible,idx){
  app.innerHTML='<div class="voile"><div class="etiq">dans le sac de '+cible.nom+'</div>'+
    '<div class="mainj" style="margin:18px 0;max-width:330px" id="sacc"></div>'+
    '<div class="hint">Tape la carte que tu veux voler.</div></div>';
  var p=$("#sacc");
  cible.sac.forEach(function(c,k){
    var d=el("div"); d.innerHTML=htmlCarte(c,"md");
    var e=d.firstElementChild; e.className+=" jouable";
    e.onclick=function(){
      if(idx===null) envoyer({t:"speciale", cible:cible.id, carte:k});
      else envoyer({t:"speciale", index:idx, cible:cible.id, carte:k});
    };
    p.appendChild(e);
  });

/* ================= L'ESPION ================= */
function ecranEspion(){
  var ev=E.evenement, aMoi=(ev.pour===MOI), trois=ev.trois||[];
  if(!aMoi){
    var combien=ev.combien||trois.length||3, dos="";
    for(var d=0;d<combien;d++) dos+=htmlDos("md");
    app.innerHTML='<div class="voile"><div class="entree" style="width:64px;height:64px;color:var(--jade)">'+
      EMBLEMES.espion+'</div><div class="libelle" style="color:var(--jade)">L\'ESPION</div>'+
      '<div class="detail">'+ev.nom+' inspecte les prochaines cartes du coffre… lui seul les voit.</div>'+
      '<div class="mainj" style="margin-top:18px">'+dos+'</div></div>';
    return;
  }
  var ordre=trois.map(function(_,i){return i;});
  var choisie=-1;        // position sélectionnée, -1 si aucune
  var posees=[];         // positions qui viennent d'être échangées (pour l'animation)
  var RANGS=["1ʳᵉ","2ᵉ","3ᵉ"];

  function dessine(){
    var consigne = choisie<0
      ? "Tape une carte pour la sélectionner."
      : "Tape maintenant la carte avec laquelle l'échanger.";
    app.innerHTML='<div class="voile"><div class="entree" style="width:56px;height:56px;color:var(--jade)">'+
      EMBLEMES.espion+'</div><div class="libelle" style="color:var(--jade)">LES 3 PROCHAINES</div>'+
      '<div class="consigne'+(choisie<0?"":" actif")+'">'+consigne+'</div>'+
      '<div class="choix" id="tr"></div>'+
      '<div class="etiq" style="margin-top:14px">ordre de sortie, de gauche à droite</div>'+
      '<button class="b-or" id="ok" style="margin-top:18px;min-width:220px">Valider cet ordre</button></div>';
    var p=$("#tr");
    ordre.forEach(function(idx,pos){
      var cls="case"+(pos===choisie?" choisie":"")+(posees.indexOf(pos)>=0?" pose":"");
      var case_=el("div",cls);
      var d=el("div"); d.innerHTML=htmlCarte(trois[idx],"lg");
      case_.appendChild(d.firstElementChild);
      case_.appendChild(el("div","rang",RANGS[pos]));
      case_.onclick=function(){ toucher(pos); };
      p.appendChild(case_);
    });
    posees=[];
    $("#ok").onclick=function(){ envoyer({t:"ordre", ordre:ordre}); };
  }

  function toucher(pos){
    if(choisie<0){                      // première touche : on sélectionne
      choisie=pos; sonSpeciale(); vibre(12);
      dessine(); return;
    }
    if(choisie===pos){                  // même carte : on annule la sélection
      choisie=-1; vibre(8);
      dessine(); return;
    }
    var t=ordre[choisie];               // deuxième touche : on échange les deux
    ordre[choisie]=ordre[pos];
    ordre[pos]=t;
    posees=[choisie,pos];
    choisie=-1;
    sonPiece(); vibre([10,40,10]);
    dessine();
  }
  dessine();
}
